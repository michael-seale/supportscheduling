<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Scheduler</title>

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React + ReactDOM (UMD) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    html, body, #root { height: 100%; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

const ROLES = [
  {
    id: "chat",  label: "Chat", isCoverage: true,
    color: "bg-orange-100 text-orange-800 border-orange-300",
    solid: "bg-orange-500 text-white border-orange-600",
    light: "bg-orange-50 text-orange-700 border-orange-300",
  },
  {
    id: "phone", label: "Phone", isCoverage: true,
    color: "bg-blue-100 text-blue-800 border-blue-300",
    solid: "bg-blue-600 text-white border-blue-700",
    light: "bg-blue-50 text-blue-700 border-blue-300",
  },
  {
    id: "email", label: "Email", isCoverage: true,
    color: "bg-green-100 text-green-800 border-green-300",
    solid: "bg-green-600 text-white border-green-700",
    light: "bg-green-50 text-green-700 border-green-300",
  },
  {
    id: "lunch", label: "Lunch", isCoverage: false,
    color: "bg-purple-100 text-purple-800 border-purple-300",
    solid: "bg-purple-600 text-white border-purple-700",
    light: "bg-purple-50 text-purple-700 border-purple-300",
  },
  {
    id: "meeting", label: "Meeting", isCoverage: false,
    color: "bg-red-100 text-red-800 border-red-300",
    solid: "bg-red-600 text-white border-red-700",
    light: "bg-red-50 text-red-700 border-red-300",
  },
];
const COVERAGE_ROLES = ROLES.filter(r => r.isCoverage);
const ROLE_BY_ID = Object.fromEntries(ROLES.map(r => [r.id, r]));

const DAYS = [
  { id: "mon", label: "Monday" },
  { id: "tue", label: "Tuesday" },
  { id: "wed", label: "Wednesday" },
  { id: "thu", label: "Thursday" },
  { id: "fri", label: "Friday" },
];

const HOURS = Array.from({ length: 12 }, (_, i) => 8 + i);

const SHIFTS = [
  { id: "eastern",  label: "Eastern",  startHour: 8,  endHour: 16 }, // 8am-5pm
  { id: "central",  label: "Central",  startHour: 9,  endHour: 17 }, // 9am-6pm
  { id: "mountain", label: "Mountain", startHour: 10, endHour: 18 }, // 10am-7pm
  { id: "pacific",  label: "Pacific",  startHour: 11, endHour: 19 }, // 11am-8pm
];
const SHIFT_BY_ID = Object.fromEntries(SHIFTS.map(s => [s.id, s]));
const DEFAULT_SHIFT_ID = "eastern";
function getShiftOf(user) {
  return (user && user.shift && SHIFT_BY_ID[user.shift]) ? user.shift : DEFAULT_SHIFT_ID;
}
function isHourInShift(shiftId, hour) {
  const s = SHIFT_BY_ID[shiftId || DEFAULT_SHIFT_ID] || SHIFT_BY_ID[DEFAULT_SHIFT_ID];
  return hour >= s.startHour && hour <= s.endHour;
}

const NEEDS = {
  8:  { chat: 0, phone: 0, email: 5 },
  9:  { chat: 2, phone: 1, email: 2 },
  10: { chat: 3, phone: 2, email: 1 },
  11: { chat: 3, phone: 2, email: 1 },
  12: { chat: 3, phone: 2, email: 1 },
  13: { chat: 3, phone: 2, email: 1 },
  14: { chat: 3, phone: 2, email: 1 },
  15: { chat: 3, phone: 2, email: 1 },
  16: { chat: 3, phone: 1, email: 1 },
  17: { chat: 0, phone: 0, email: 1 },
  18: { chat: 0, phone: 0, email: 1 },
  19: { chat: 0, phone: 0, email: 1 },
};

// LocalStorage key used only for small UI preferences (not data).
const UI_PREFS_KEY = "sched.ui.v2";
function loadPrefs() {
  try { return JSON.parse(localStorage.getItem(UI_PREFS_KEY) || "{}"); } catch { return {}; }
}
function savePrefs(p) { try { localStorage.setItem(UI_PREFS_KEY, JSON.stringify(p)); } catch {} }

// ---- API client ----
async function apiRequest(method, url, body) {
  const init = { method, credentials: "same-origin", headers: {} };
  if (body !== undefined) {
    init.headers["Content-Type"] = "application/json";
    init.body = JSON.stringify(body);
  }
  const res = await fetch(url, init);
  const ct = res.headers.get("content-type") || "";
  const data = ct.includes("application/json") ? await res.json() : await res.text();
  if (!res.ok) {
    const msg = (data && data.error) || (typeof data === "string" ? data : "Request failed");
    const err = new Error(msg); err.status = res.status; err.data = data;
    throw err;
  }
  return data;
}
const api = {
  get:    (url)       => apiRequest("GET", url),
  post:   (url, body) => apiRequest("POST", url, body),
  put:    (url, body) => apiRequest("PUT", url, body),
  patch:  (url, body) => apiRequest("PATCH", url, body),
  delete: (url)       => apiRequest("DELETE", url),
};

function formatHour(h) {
  const suffix = h >= 12 ? "pm" : "am";
  const disp = ((h + 11) % 12) + 1;
  return `${disp}${suffix}`;
}
function hourRangeLabel(h) { return `${formatHour(h)}–${formatHour(h + 1)}`; }

const MONTH_NAMES = [
  "January", "February", "March", "April", "May", "June",
  "July", "August", "September", "October", "November", "December",
];

function getMondayOf(date) {
  const d = new Date(date);
  const day = d.getDay(); // 0=Sun, 1=Mon, ..., 6=Sat
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0, 0, 0, 0);
  return d;
}
function addDays(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}
function toDateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function parseDateKey(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, (m || 1) - 1, d || 1);
}
function formatWeekRange(monday) {
  const friday = addDays(monday, 4);
  const mM = MONTH_NAMES[monday.getMonth()];
  const fM = MONTH_NAMES[friday.getMonth()];
  return `${mM} ${monday.getDate()} – ${fM} ${friday.getDate()}`;
}


// Persist a small UI preference in localStorage (survives reloads).
function useLocalPref(field, fallback) {
  const [val, setVal] = useState(() => {
    const p = loadPrefs();
    return (p && field in p) ? p[field] : fallback;
  });
  useEffect(() => {
    const p = loadPrefs();
    p[field] = val;
    savePrefs(p);
  }, [field, val]);
  return [val, setVal];
}

// Hook: load + mutate the users list against the API.
function useUsers() {
  const [users, setUsers] = useState(null);
  const [error, setError] = useState(null);
  const reload = async () => {
    try { setUsers(await api.get("/api/users")); setError(null); }
    catch (e) { setError(e); }
  };
  useEffect(() => { reload(); }, []);
  return {
    users: users || [],
    loading: users === null,
    error,
    reload,
    create: async (data) => { await api.post("/api/users", data); await reload(); },
    update: async (username, data) => { await api.patch(`/api/users/${encodeURIComponent(username)}`, data); await reload(); },
    remove: async (username) => { await api.delete(`/api/users/${encodeURIComponent(username)}`); await reload(); },
    rotateToken: async (username) => {
      const r = await api.post(`/api/users/${encodeURIComponent(username)}/rotate-token`);
      await reload();
      return r.icalToken;
    },
  };
}

// Hook: load + optimistically replace the schedule for a single week.
function useWeekSchedule(weekKey) {
  const [schedule, setSchedule] = useState(null);
  const [error, setError] = useState(null);
  useEffect(() => {
    let cancelled = false;
    setSchedule(null);
    api.get(`/api/schedule/${weekKey}`).then(d => { if (!cancelled) setSchedule(d); })
      .catch(e => { if (!cancelled) setError(e); });
    return () => { cancelled = true; };
  }, [weekKey]);
  const replace = async (nextOrFn) => {
    const prev = schedule || {};
    const next = typeof nextOrFn === "function" ? nextOrFn(prev) : nextOrFn;
    setSchedule(next); // optimistic
    try {
      const got = await api.put(`/api/schedule/${weekKey}`, next);
      setSchedule(got);
    } catch (e) {
      setError(e);
      // revert by refetching
      try { setSchedule(await api.get(`/api/schedule/${weekKey}`)); } catch {}
      alert("Failed to save schedule: " + e.message);
    }
  };
  return { schedule: schedule || {}, loading: schedule === null, error, replace };
}

function getCellAssignments(schedule, dayId, hour) {
  return (schedule && schedule[dayId] && schedule[dayId][hour]) ? schedule[dayId][hour] : [];
}
function setCellAssignments(schedule, dayId, hour, assignments) {
  const next = { ...schedule };
  next[dayId] = { ...(next[dayId] || {}) };
  if (assignments.length === 0) delete next[dayId][hour];
  else next[dayId][hour] = assignments;
  if (Object.keys(next[dayId]).length === 0) delete next[dayId];
  return next;
}

function LoginView({ onLogin }) {
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [submitting, setSubmitting] = useState(false);

  async function submit(e) {
    e.preventDefault();
    setError(""); setSubmitting(true);
    try {
      const session = await api.post("/api/login", { username: username.trim(), password });
      onLogin(session);
    } catch (err) {
      setError(err.message || "Sign-in failed");
    } finally {
      setSubmitting(false);
    }
  }

  return (
    <div className="min-h-screen bg-slate-50 flex items-center justify-center p-6">
      <form onSubmit={submit} className="bg-white shadow-md rounded-xl p-8 w-full max-w-sm border border-slate-200">
        <h1 className="text-2xl font-semibold text-slate-800 mb-1">Team Scheduler</h1>
        <p className="text-sm text-slate-500 mb-6">Sign in to continue</p>
        <label className="block text-sm font-medium text-slate-700 mb-1">Username</label>
        <input autoFocus value={username} onChange={e => setUsername(e.target.value)}
          className="w-full border border-slate-300 rounded-md px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-400" />
        <label className="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input type="password" value={password} onChange={e => setPassword(e.target.value)}
          className="w-full border border-slate-300 rounded-md px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-400" />
        {error && <div className="text-sm text-red-600 mb-3">{error}</div>}
        <button type="submit" disabled={submitting}
          className="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-md disabled:opacity-60">
          {submitting ? "Signing in…" : "Sign in"}
        </button>
        <div className="mt-6 text-xs text-slate-500 leading-relaxed">
          Default admin: <span className="font-mono">admin</span> / <span className="font-mono">admin123</span>.
          Change the password and add employees once logged in.
        </div>
      </form>
    </div>
  );
}

function ScheduleGrid({ schedule, setSchedule, employees }) {
  const [editing, setEditing] = useState(null); // { dayId, hour, role }
  return (
    <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
      <div className="grid" style={{ gridTemplateColumns: "90px repeat(5, minmax(0, 1fr))" }}>
        <div className="bg-slate-100 border-b border-slate-200 p-2 text-xs font-semibold text-slate-500 uppercase tracking-wide">Time (ET)</div>
        {DAYS.map(d => (
          <div key={d.id} className="bg-slate-100 border-b border-l border-slate-200 p-2 text-sm font-semibold text-slate-700">{d.label}</div>
        ))}
        {HOURS.map(h => (
          <React.Fragment key={h}>
            <div className="border-b border-slate-200 p-2 text-xs text-slate-500 bg-slate-50 flex items-start">{hourRangeLabel(h)}</div>
            {DAYS.map(d => (
              <ScheduleCell key={`${d.id}-${h}`} dayId={d.id} hour={h}
                assignments={getCellAssignments(schedule, d.id, h)}
                onEditRole={(role) => setEditing({ dayId: d.id, hour: h, role })} />
            ))}
          </React.Fragment>
        ))}
      </div>
      {editing && (
        <RoleAssignModal
          dayId={editing.dayId}
          hour={editing.hour}
          role={editing.role}
          schedule={schedule}
          employees={employees}
          onClose={() => setEditing(null)}
          onSave={(assignments) => {
            setSchedule(setCellAssignments(schedule, editing.dayId, editing.hour, assignments));
            setEditing(null);
          }}
        />
      )}
    </div>
  );
}

function DailyScheduleView({ schedule, setSchedule, employees }) {
  const [dayId, setDayId] = useState("mon");
  const [editing, setEditing] = useState(null); // { hour, role } for needs-pill modal

  const dayLabel = (DAYS.find(d => d.id === dayId) || {}).label;

  function setRoleForUser(username, hour, newRole) {
    const existing = getCellAssignments(schedule, dayId, hour);
    const withoutUser = existing.filter(a => a.username !== username);
    const next = newRole ? [...withoutUser, { username, role: newRole }] : withoutUser;
    setSchedule(setCellAssignments(schedule, dayId, hour, next));
  }

  // Build an array of runs for a given employee across the day's HOURS.
  // Consecutive hours with the same truthy role merge into a single "assigned"
  // run; consecutive off-shift hours merge into a single "off" run; empty
  // in-shift hours stay as their own single-hour run so they're clickable.
  function getRunsForEmployee(username, shiftId) {
    const runs = [];
    let current = null;
    HOURS.forEach(h => {
      const inShift = isHourInShift(shiftId, h);
      if (!inShift) {
        if (current && current.type === "off" && current.endHour === h - 1) {
          current.endHour = h;
        } else {
          current = { type: "off", startHour: h, endHour: h, role: "" };
          runs.push(current);
        }
        return;
      }
      const assigns = getCellAssignments(schedule, dayId, h);
      const mine = assigns.find(a => a.username === username);
      const role = mine ? mine.role : "";
      if (role && current && current.type === "assigned" && current.role === role && current.endHour === h - 1) {
        current.endHour = h;
      } else {
        current = { type: "assigned", startHour: h, endHour: h, role };
        runs.push(current);
        if (!role) current = null; // don't merge empty cells
      }
    });
    return runs;
  }

  // Apply a role change to every hour in a run's range.
  function setRoleForRun(username, run, newRole) {
    let nextSched = schedule;
    for (let h = run.startHour; h <= run.endHour; h++) {
      const existing = getCellAssignments(nextSched, dayId, h);
      const withoutUser = existing.filter(a => a.username !== username);
      const hourNext = newRole ? [...withoutUser, { username, role: newRole }] : withoutUser;
      nextSched = setCellAssignments(nextSched, dayId, h, hourNext);
    }
    setSchedule(nextSched);
  }

  return (
    <div>
      {/* Day picker */}
      <div className="flex flex-wrap gap-1 mb-3">
        {DAYS.map(d => (
          <button
            key={d.id}
            onClick={() => setDayId(d.id)}
            className={`px-3 py-1.5 rounded-md text-sm font-medium transition ${
              dayId === d.id
                ? "bg-blue-600 text-white"
                : "bg-white border border-slate-300 text-slate-700 hover:bg-slate-50"
            }`}
          >
            {d.label}
          </button>
        ))}
      </div>

      {employees.length === 0 ? (
        <div className="bg-amber-50 border border-amber-200 text-amber-800 rounded-xl p-4 text-sm">
          Add users on the Employees tab first, then come back here to schedule them by day.
        </div>
      ) : (
        <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-x-auto">
          <table className="w-full text-sm border-collapse">
            <thead>
              {/* Hour label row */}
              <tr>
                <th className="bg-slate-100 border-b border-slate-200 p-2 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide sticky left-0 z-20">
                  {dayLabel}
                </th>
                {HOURS.map(h => (
                  <th key={h} className="bg-slate-100 border-b border-l border-slate-200 p-2 text-center text-xs font-semibold text-slate-700 whitespace-nowrap">
                    {hourRangeLabel(h)}
                  </th>
                ))}
              </tr>
              {/* Coverage needs row */}
              <tr>
                <th className="bg-slate-50 border-b border-slate-200 p-2 text-left text-[11px] font-semibold text-slate-500 uppercase tracking-wide sticky left-0 z-20">
                  Coverage
                </th>
                {HOURS.map(h => {
                  const needs = NEEDS[h] || { chat: 0, phone: 0, email: 0 };
                  const assigns = getCellAssignments(schedule, dayId, h);
                  const counts = {};
                  assigns.forEach(a => { counts[a.role] = (counts[a.role] || 0) + 1; });
                  return (
                    <td key={h} className="bg-slate-50 border-b border-l border-slate-200 p-1 align-top">
                      <div className="flex flex-col gap-1">
                        {COVERAGE_ROLES.map(r => {
                          const need = needs[r.id] || 0;
                          const have = counts[r.id] || 0;
                          const filled = (need > 0 && have >= need) || (need === 0 && have > 0);
                          let btnClass;
                          if (filled) btnClass = r.solid;
                          else if (need > 0 || have > 0) btnClass = r.light;
                          else btnClass = "bg-white text-slate-400 border-slate-200";
                          const countText = need > 0 ? `${have}/${need}` : `${have}`;
                          return (
                            <button
                              key={r.id}
                              onClick={() => setEditing({ hour: h, role: r.id })}
                              title={`${have} of ${need} ${r.label} — click to manage`}
                              className={`${btnClass} border rounded px-1.5 py-0.5 text-[10px] hover:opacity-80 transition flex items-center justify-between gap-1`}
                            >
                              <span className="font-semibold">{r.label.charAt(0)}</span>
                              <span className="tabular-nums">{countText}</span>
                            </button>
                          );
                        })}
                      </div>
                    </td>
                  );
                })}
              </tr>
            </thead>
            <tbody>
              {employees.map(emp => {
                const shiftId = getShiftOf(emp);
                const runs = getRunsForEmployee(emp.username, shiftId);
                const shiftLabel = (SHIFT_BY_ID[shiftId] || {}).label || "";
                return (
                  <tr key={emp.username} className="border-t border-slate-200">
                    <td className="p-2 bg-white border-r border-slate-200 font-medium text-slate-700 sticky left-0 z-10 whitespace-nowrap">
                      {emp.displayName || emp.username}
                      {emp.role === "admin" && (
                        <span className="ml-2 text-[10px] uppercase text-blue-700 bg-blue-50 border border-blue-200 rounded px-1 py-0.5">Admin</span>
                      )}
                      <span className="ml-2 text-[10px] uppercase text-slate-500 bg-slate-100 border border-slate-200 rounded px-1 py-0.5">{shiftLabel}</span>
                    </td>
                    {runs.map(run => {
                      const span = run.endHour - run.startHour + 1;
                      if (run.type === "off") {
                        return (
                          <td
                            key={run.startHour}
                            colSpan={span}
                            className="p-1 border-l border-slate-200 bg-slate-100 align-middle"
                            title={`Off shift — ${shiftLabel} (${formatHour(SHIFT_BY_ID[shiftId].startHour)}–${formatHour(SHIFT_BY_ID[shiftId].endHour + 1)})`}
                          >
                            <div className="text-center text-[11px] text-slate-400 italic select-none">Off</div>
                          </td>
                        );
                      }
                      const role = run.role;
                      const roleObj = role ? ROLE_BY_ID[role] : null;
                      const isMulti = span > 1;
                      const selectClass = roleObj
                        ? `${roleObj.solid} border font-semibold`
                        : "bg-white border-slate-200 text-slate-400";
                      const rangeTitle = roleObj
                        ? `${roleObj.label} · ${formatHour(run.startHour)}–${formatHour(run.endHour + 1)}`
                        : "";
                      return (
                        <td
                          key={run.startHour}
                          colSpan={span}
                          className="p-1 border-l border-slate-200 align-middle"
                        >
                          <div className="relative">
                            <select
                              value={role}
                              onChange={(e) => setRoleForRun(emp.username, run, e.target.value)}
                              title={rangeTitle}
                              className={`${selectClass} w-full text-xs rounded ${isMulti ? "px-2 py-1.5" : "px-1 py-1"} cursor-pointer focus:outline-none focus:ring-2 focus:ring-blue-400`}
                            >
                              <option value="">—</option>
                              {ROLES.map(r => (
                                <option key={r.id} value={r.id}>{r.label}</option>
                              ))}
                            </select>
                            {isMulti && roleObj && (
                              <span className="pointer-events-none absolute inset-y-0 left-2 flex items-center text-[10px] uppercase tracking-wide opacity-90">
                                {span}h
                              </span>
                            )}
                          </div>
                        </td>
                      );
                    })}
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

      {editing && (
        <RoleAssignModal
          dayId={dayId}
          hour={editing.hour}
          role={editing.role}
          schedule={schedule}
          employees={employees}
          onClose={() => setEditing(null)}
          onSave={(assignments) => {
            setSchedule(setCellAssignments(schedule, dayId, editing.hour, assignments));
            setEditing(null);
          }}
        />
      )}
    </div>
  );
}

function ScheduleCell({ dayId, hour, assignments, onEditRole }) {
  const needs = NEEDS[hour] || { chat: 0, phone: 0, email: 0 };
  const assignedByRole = {};
  ROLES.forEach(r => { assignedByRole[r.id] = []; });
  assignments.forEach(a => {
    if (!assignedByRole[a.role]) assignedByRole[a.role] = [];
    assignedByRole[a.role].push(a.username);
  });

  return (
    <div className="border-b border-l border-slate-200 p-1.5 min-h-[72px]">
      <div className="flex flex-col gap-1">
        {COVERAGE_ROLES.map(r => {
          const need = needs[r.id] || 0;
          const names = assignedByRole[r.id] || [];
          const have = names.length;

          // Style states:
          //  - filled: solid color (have >= need && need > 0), or any assignments when need == 0
          //  - partial: light color (0 < have < need)
          //  - empty-with-need: light color (need > 0, have == 0)
          //  - zero/zero: muted (need == 0 && have == 0) — still clickable
          let btnClass;
          if ((need > 0 && have >= need) || (need === 0 && have > 0)) {
            btnClass = r.solid;
          } else if (need > 0 || have > 0) {
            btnClass = r.light;
          } else {
            btnClass = "bg-slate-50 text-slate-400 border-slate-200";
          }

          const countText = need > 0 ? `${have}/${need}` : `${have}`;

          return (
            <button
              key={r.id}
              onClick={() => onEditRole(r.id)}
              title={`${have} of ${need} ${r.label} assigned — click to edit`}
              className={`${btnClass} border text-left w-full px-2 py-1 rounded text-[11px] hover:opacity-80 transition`}
            >
              <div className="flex items-center justify-between gap-1">
                <span className="font-semibold">{r.label}</span>
                <span className="tabular-nums">{countText}</span>
              </div>
              {names.length > 0 && (
                <div className="text-[10px] mt-0.5 opacity-90 truncate">
                  {names.join(", ")}
                </div>
              )}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function RoleAssignModal({ dayId, hour, role, schedule, employees, onClose, onSave }) {
  const existing = getCellAssignments(schedule, dayId, hour);
  const currentForRole = existing.filter(a => a.role === role).map(a => a.username);
  const [selected, setSelected] = useState(() => new Set(currentForRole));

  // Map of username -> other role they're on at this hour (if any)
  const otherRole = {};
  existing.forEach(a => { if (a.role !== role) otherRole[a.username] = a.role; });

  const dayLabel = (DAYS.find(d => d.id === dayId) || {}).label;
  const roleObj = ROLE_BY_ID[role] || { label: role };
  const need = (NEEDS[hour] || {})[role] || 0;

  function toggle(username) {
    const next = new Set(selected);
    if (next.has(username)) next.delete(username);
    else next.add(username);
    setSelected(next);
  }

  function save() {
    const kept = existing.filter(a => a.role !== role);
    const added = Array.from(selected).map(username => ({ username, role }));
    onSave([...kept, ...added]);
  }

  const have = selected.size;
  const meetsNeed = need === 0 || have >= need;

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50" onClick={onClose}>
      <div className="bg-white rounded-xl shadow-xl w-full max-w-md p-6" onClick={e => e.stopPropagation()}>
        <div className="flex items-start justify-between mb-1">
          <h3 className="text-lg font-semibold text-slate-800">
            {dayLabel} · {hourRangeLabel(hour)}
          </h3>
          <span className={`text-xs font-semibold px-2 py-0.5 rounded border ${roleObj.solid}`}>
            {roleObj.label}
          </span>
        </div>
        <p className="text-sm text-slate-500 mb-4">
          {need > 0
            ? <span>{have}/{need} assigned {meetsNeed && <span className="text-green-700">· fully staffed</span>}</span>
            : <span>{have} assigned · no minimum for this hour</span>}
        </p>

        {employees.length === 0 ? (
          <div className="text-sm text-amber-700 bg-amber-50 border border-amber-200 rounded-md p-3 mb-4">
            No users yet. Add them on the Employees tab.
          </div>
        ) : (
          <div className="max-h-80 overflow-y-auto border border-slate-200 rounded-md mb-4">
            {employees.map(emp => {
              const busyOn = otherRole[emp.username];
              const isBusy = !!busyOn;
              const empShift = getShiftOf(emp);
              const offShift = !isHourInShift(empShift, hour);
              const isDisabled = isBusy || offShift;
              const isSelected = selected.has(emp.username);
              const busyLabel = isBusy && ((ROLE_BY_ID[busyOn] || {}).label || busyOn);
              const shiftLabel = (SHIFT_BY_ID[empShift] || {}).label || "";
              let note = null;
              if (isBusy) note = `Already on ${busyLabel} this hour`;
              else if (offShift) note = `Off shift (${shiftLabel})`;
              return (
                <label
                  key={emp.username}
                  className={`flex items-center gap-3 px-3 py-2 border-b last:border-b-0 border-slate-100 ${
                    isDisabled ? "opacity-60 cursor-not-allowed bg-slate-50" : "cursor-pointer hover:bg-slate-50"
                  }`}
                >
                  <input
                    type="checkbox"
                    disabled={isDisabled}
                    checked={isSelected}
                    onChange={() => !isDisabled && toggle(emp.username)}
                    className="w-4 h-4"
                  />
                  <div className="flex-1 min-w-0">
                    <div className="text-sm text-slate-800">
                      {emp.displayName || emp.username}
                      {emp.role === "admin" && (
                        <span className="ml-2 text-[10px] uppercase text-blue-700 bg-blue-50 border border-blue-200 rounded px-1 py-0.5">Admin</span>
                      )}
                      <span className="ml-2 text-[10px] uppercase text-slate-500 bg-slate-100 border border-slate-200 rounded px-1 py-0.5">{shiftLabel}</span>
                    </div>
                    {note && (
                      <div className="text-xs text-slate-500">{note}</div>
                    )}
                  </div>
                </label>
              );
            })}
          </div>
        )}

        <div className="flex justify-end gap-2">
          <button onClick={onClose} className="px-4 py-2 text-sm text-slate-600 hover:text-slate-800">Cancel</button>
          <button onClick={save}
            className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-md">Save</button>
        </div>
      </div>
    </div>
  );
}

function EmployeesTab({ usersApi, currentUsername }) {
  const users = usersApi.users;
  const [form, setForm] = useState({ username: "", displayName: "", password: "", role: "employee", shift: DEFAULT_SHIFT_ID });
  const [error, setError] = useState("");

  async function addUser(e) {
    e.preventDefault(); setError("");
    const username = form.username.trim().toLowerCase();
    if (!username || !form.password) { setError("Username and password are required."); return; }
    try {
      await usersApi.create({
        username,
        password: form.password,
        role: form.role,
        displayName: form.displayName.trim() || username,
        shift: form.shift,
      });
      setForm({ username: "", displayName: "", password: "", role: "employee", shift: DEFAULT_SHIFT_ID });
    } catch (err) { setError(err.message || "Could not add user."); }
  }

  async function removeUser(username) {
    if (username.toLowerCase() === currentUsername.toLowerCase()) {
      alert("You can't remove your own account while signed in.");
      return;
    }
    if (!confirm(`Remove user "${username}"?`)) return;
    try { await usersApi.remove(username); }
    catch (err) { alert(err.message || "Could not remove user."); }
  }

  async function resetPassword(username) {
    const pwd = prompt(`New password for ${username}:`);
    if (!pwd) return;
    try { await usersApi.update(username, { password: pwd }); }
    catch (err) { alert(err.message || "Could not reset password."); }
  }

  async function changeRole(username, newRole) {
    if (username.toLowerCase() === currentUsername.toLowerCase() && newRole !== "admin") {
      alert("You can't demote your own account while signed in. Ask another admin to change your role.");
      return;
    }
    try { await usersApi.update(username, { role: newRole }); }
    catch (err) { alert(err.message || "Could not change role."); }
  }

  async function changeShift(username, newShift) {
    try { await usersApi.update(username, { shift: newShift }); }
    catch (err) { alert(err.message || "Could not change shift."); }
  }

  async function rotateIcalToken(username) {
    if (!confirm(`Rotate the iCal link for ${username}? Their old link will stop working.`)) return;
    try { await usersApi.rotateToken(username); }
    catch (err) { alert(err.message || "Could not rotate token."); }
  }

  function copyIcalUrl(token) {
    const url = `${window.location.origin}/ical/${token}.ics`;
    copyToClipboard(url, "iCal link copied to clipboard");
  }

  const adminCount = users.filter(u => u.role === "admin").length;

  return (
    <div className="space-y-6">
      <div className="bg-white border border-slate-200 rounded-xl p-6">
        <h3 className="text-md font-semibold text-slate-800 mb-4">Add user</h3>
        <form onSubmit={addUser} className="grid grid-cols-1 sm:grid-cols-6 gap-3">
          <input placeholder="Username" value={form.username} onChange={e => setForm({ ...form, username: e.target.value })}
            className="border border-slate-300 rounded-md px-3 py-2 text-sm" />
          <input placeholder="Display name (optional)" value={form.displayName} onChange={e => setForm({ ...form, displayName: e.target.value })}
            className="border border-slate-300 rounded-md px-3 py-2 text-sm" />
          <input placeholder="Password" type="text" value={form.password} onChange={e => setForm({ ...form, password: e.target.value })}
            className="border border-slate-300 rounded-md px-3 py-2 text-sm" />
          <select value={form.role} onChange={e => setForm({ ...form, role: e.target.value })}
            className="border border-slate-300 rounded-md px-3 py-2 text-sm bg-white">
            <option value="employee">Employee</option>
            <option value="admin">Admin</option>
          </select>
          <select value={form.shift} onChange={e => setForm({ ...form, shift: e.target.value })}
            className="border border-slate-300 rounded-md px-3 py-2 text-sm bg-white">
            {SHIFTS.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
          </select>
          <button className="bg-blue-600 hover:bg-blue-700 text-white rounded-md text-sm font-medium px-4">Add</button>
        </form>
        {error && <div className="mt-2 text-sm text-red-600">{error}</div>}
      </div>

      <div className="bg-white border border-slate-200 rounded-xl overflow-hidden">
        <div className="p-4 border-b border-slate-200 flex items-center justify-between">
          <h3 className="text-md font-semibold text-slate-800">Users ({users.length})</h3>
        </div>
        {users.length === 0 ? (
          <div className="p-6 text-sm text-slate-500 italic">No users yet.</div>
        ) : (
          <table className="w-full text-sm">
            <thead className="bg-slate-50 text-left text-slate-600 text-xs uppercase">
              <tr>
                <th className="px-4 py-2">Username</th>
                <th className="px-4 py-2">Display name</th>
                <th className="px-4 py-2">Role</th>
                <th className="px-4 py-2">Shift</th>
                <th className="px-4 py-2">Password</th>
                <th className="px-4 py-2"></th>
              </tr>
            </thead>
            <tbody>
              {users.map(u => {
                const isSelf = u.username.toLowerCase() === currentUsername.toLowerCase();
                const isLastAdmin = u.role === "admin" && adminCount === 1;
                return (
                  <tr key={u.username} className="border-t border-slate-100">
                    <td className="px-4 py-2 font-mono text-slate-700">
                      {u.username}
                      {isSelf && <span className="ml-2 text-xs text-slate-400">(you)</span>}
                    </td>
                    <td className="px-4 py-2 text-slate-700">{u.displayName}</td>
                    <td className="px-4 py-2">
                      <select
                        value={u.role}
                        onChange={e => changeRole(u.username, e.target.value)}
                        disabled={isLastAdmin}
                        title={isLastAdmin ? "At least one admin is required" : ""}
                        className={`border rounded-md px-2 py-1 text-xs bg-white ${
                          u.role === "admin"
                            ? "border-blue-300 text-blue-700"
                            : "border-slate-300 text-slate-700"
                        } ${isLastAdmin ? "opacity-60 cursor-not-allowed" : ""}`}
                      >
                        <option value="employee">Employee</option>
                        <option value="admin">Admin</option>
                      </select>
                    </td>
                    <td className="px-4 py-2">
                      <select
                        value={getShiftOf(u)}
                        onChange={e => changeShift(u.username, e.target.value)}
                        className="border border-slate-300 rounded-md px-2 py-1 text-xs bg-white text-slate-700"
                      >
                        {SHIFTS.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
                      </select>
                    </td>
                    <td className="px-4 py-2 font-mono text-slate-400">••••••••</td>
                    <td className="px-4 py-2 text-right space-x-3">
                      <button onClick={() => resetPassword(u.username)} className="text-blue-600 hover:text-blue-800 text-xs">Reset password</button>
                      <button
                        onClick={() => removeUser(u.username)}
                        disabled={isSelf}
                        title={isSelf ? "You can't remove your own account" : ""}
                        className={`text-xs ${isSelf ? "text-slate-300 cursor-not-allowed" : "text-red-600 hover:text-red-800"}`}
                      >
                        Remove
                      </button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

// Compute a rendering plan for the weekly grid of one employee.
// Returns plan[dayId][hour] = { type, role?, rowSpan, startHour } for cells
// that should render (as the start of a run), or null for cells that are
// covered by an earlier rowSpan-merged cell in the same column.
function buildEmployeeWeekPlan(schedule, username, shiftId) {
  const plan = {};
  DAYS.forEach(d => {
    plan[d.id] = {};
    let running = null;
    HOURS.forEach(h => {
      const inShift = isHourInShift(shiftId, h);
      if (!inShift) {
        if (running && running.type === "off" && running.endHour === h - 1) {
          running.rowSpan += 1;
          running.endHour = h;
          plan[d.id][h] = null;
        } else {
          running = { type: "off", role: "", rowSpan: 1, startHour: h, endHour: h };
          plan[d.id][h] = running;
        }
        return;
      }
      const assigns = getCellAssignments(schedule, d.id, h);
      const mine = assigns.find(a => a.username.toLowerCase() === username.toLowerCase());
      const role = mine ? mine.role : "";
      if (role && running && running.type === "assigned" && running.role === role && running.endHour === h - 1) {
        running.rowSpan += 1;
        running.endHour = h;
        plan[d.id][h] = null;
      } else {
        running = { type: "assigned", role, rowSpan: 1, startHour: h, endHour: h };
        plan[d.id][h] = running;
        if (!role) running = null; // empty in-shift hours don't merge
      }
    });
  });
  return plan;
}

function EmployeeGrid({ schedule, username, shiftId }) {
  const resolvedShift = shiftId || DEFAULT_SHIFT_ID;
  const plan = buildEmployeeWeekPlan(schedule, username, resolvedShift);
  return (
    <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
      <table className="w-full text-sm border-collapse">
        <thead>
          <tr>
            <th className="bg-slate-100 border-b border-slate-200 p-2 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide w-[90px]">Time (ET)</th>
            {DAYS.map(d => (
              <th key={d.id} className="bg-slate-100 border-b border-l border-slate-200 p-2 text-sm font-semibold text-slate-700">{d.label}</th>
            ))}
          </tr>
        </thead>
        <tbody>
          {HOURS.map(h => (
            <tr key={h} className="border-t border-slate-200">
              <td className="p-2 text-xs text-slate-500 bg-slate-50 border-r border-slate-200 whitespace-nowrap align-top">{hourRangeLabel(h)}</td>
              {DAYS.map(d => {
                const cell = plan[d.id][h];
                if (cell === null) return null; // covered by rowSpan above
                if (cell.type === "off") {
                  return (
                    <td
                      key={d.id}
                      rowSpan={cell.rowSpan}
                      className="border-l border-slate-200 bg-slate-100 p-2 align-middle"
                    >
                      <div className="text-center text-[11px] text-slate-400 italic select-none">Off</div>
                    </td>
                  );
                }
                const roleObj = cell.role ? ROLE_BY_ID[cell.role] : null;
                if (!roleObj) {
                  return (
                    <td
                      key={d.id}
                      rowSpan={cell.rowSpan}
                      className="border-l border-slate-200 p-2 min-h-[40px] align-middle"
                    ></td>
                  );
                }
                return (
                  <td
                    key={d.id}
                    rowSpan={cell.rowSpan}
                    className={`border-l border-slate-200 align-middle p-0`}
                  >
                    <div className={`w-full h-full flex flex-col items-center justify-center text-center ${roleObj.solid} px-2 py-2 text-xs font-semibold`}>
                      <span>{roleObj.label}</span>
                      {cell.rowSpan > 1 && (
                        <span className="text-[10px] opacity-90 mt-0.5">
                          {formatHour(cell.startHour)}–{formatHour(cell.endHour + 1)} · {cell.rowSpan}h
                        </span>
                      )}
                    </div>
                  </td>
                );
              })}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function EmployeeDayStrip({ schedule, username, shiftId, dayId, setDayId }) {
  const resolvedShift = shiftId || DEFAULT_SHIFT_ID;
  // Build runs across HOURS for this employee/day, merging same-role hours and
  // off-shift hours separately.
  const runs = useMemo(() => {
    const r = [];
    let current = null;
    HOURS.forEach(h => {
      const inShift = isHourInShift(resolvedShift, h);
      if (!inShift) {
        if (current && current.type === "off" && current.endHour === h - 1) {
          current.endHour = h;
        } else {
          current = { type: "off", role: "", startHour: h, endHour: h };
          r.push(current);
        }
        return;
      }
      const assigns = getCellAssignments(schedule, dayId, h);
      const mine = assigns.find(a => a.username.toLowerCase() === username.toLowerCase());
      const role = mine ? mine.role : "";
      if (role && current && current.type === "assigned" && current.role === role && current.endHour === h - 1) {
        current.endHour = h;
      } else {
        current = { type: "assigned", role, startHour: h, endHour: h };
        r.push(current);
        if (!role) current = null;
      }
    });
    return r;
  }, [schedule, username, dayId, resolvedShift]);

  return (
    <div>
      <div className="flex flex-wrap gap-1 mb-3">
        {DAYS.map(d => (
          <button
            key={d.id}
            onClick={() => setDayId(d.id)}
            className={`px-3 py-1.5 rounded-md text-sm font-medium transition ${
              dayId === d.id
                ? "bg-blue-600 text-white"
                : "bg-white border border-slate-300 text-slate-700 hover:bg-slate-50"
            }`}
          >
            {d.label}
          </button>
        ))}
      </div>
      <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-x-auto">
        <table className="w-full text-sm border-collapse">
          <thead>
            <tr>
              {HOURS.map(h => (
                <th key={h} className="bg-slate-100 border-b border-l first:border-l-0 border-slate-200 p-2 text-center text-[11px] font-semibold text-slate-600 whitespace-nowrap">
                  {hourRangeLabel(h)}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            <tr>
              {runs.map(run => {
                const span = run.endHour - run.startHour + 1;
                if (run.type === "off") {
                  return (
                    <td
                      key={run.startHour}
                      colSpan={span}
                      className="border-t border-l first:border-l-0 border-slate-200 bg-slate-100 p-3 align-middle"
                    >
                      <div className="text-center text-[11px] text-slate-400 italic select-none">Off</div>
                    </td>
                  );
                }
                const roleObj = run.role ? ROLE_BY_ID[run.role] : null;
                if (!roleObj) {
                  return (
                    <td
                      key={run.startHour}
                      colSpan={span}
                      className="border-t border-l first:border-l-0 border-slate-200 p-3 align-middle"
                    >
                      <div className="text-center text-[11px] text-slate-300">—</div>
                    </td>
                  );
                }
                return (
                  <td
                    key={run.startHour}
                    colSpan={span}
                    className="border-t border-l first:border-l-0 border-slate-200 p-0 align-middle"
                  >
                    <div className={`w-full h-full ${roleObj.solid} px-3 py-3 text-center text-xs font-semibold`}>
                      <span>{roleObj.label}</span>
                      {span > 1 && (
                        <span className="ml-2 text-[10px] opacity-90">
                          {formatHour(run.startHour)}–{formatHour(run.endHour + 1)} · {span}h
                        </span>
                      )}
                    </div>
                  </td>
                );
              })}
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  );
}

function EmployeeApp({ session, onLogout }) {
  const [fullSchedule] = useLocalState(LS_KEYS.schedule, {});
  const [users] = useLocalState(LS_KEYS.users, []);
  const [weekStart, setWeekStart] = useState(() => getMondayOf(new Date()));
  const weekKey = toDateKey(weekStart);
  const schedule = fullSchedule[weekKey] || {};
  const mySelf = users.find(u => u.username.toLowerCase() === session.username.toLowerCase());
  const myShiftId = getShiftOf(mySelf);
  const myShifts = useMemo(() => {
    const rows = [];
    DAYS.forEach(d => {
      HOURS.forEach(h => {
        const assigns = getCellAssignments(schedule, d.id, h);
        assigns.filter(a => a.username.toLowerCase() === session.username.toLowerCase())
          .forEach(a => rows.push({ day: d, hour: h, role: a.role }));
      });
    });
    return rows;
  }, [schedule, session.username]);

  const todayMon = getMondayOf(new Date());
  const weekLabel = toDateKey(weekStart) === toDateKey(todayMon)
    ? "This week"
    : formatWeekRange(weekStart);

  return (
    <div className="min-h-screen bg-slate-50">
      <TopBar session={session} onLogout={onLogout} title="My Schedule" />
      <div className="max-w-7xl mx-auto px-6 py-6">
        <div className="mb-4 flex items-end justify-between gap-3 flex-wrap">
          <div>
            <h2 className="text-xl font-semibold text-slate-800">{weekLabel}</h2>
            <p className="text-sm text-slate-500">Monday–Friday, 8am–8pm ET · times shown in Eastern Time</p>
          </div>
          <div className="flex items-center gap-3">
            <span className="text-sm text-slate-600">{myShifts.length} shift{myShifts.length === 1 ? "" : "s"} assigned</span>
            <WeekSelector weekStart={weekStart} onChange={setWeekStart} />
          </div>
        </div>
        <EmployeeGrid schedule={schedule} username={session.username} shiftId={myShiftId} />
        <div className="mt-8 bg-white border border-slate-200 rounded-xl overflow-hidden">
          <div className="p-4 border-b border-slate-200 text-sm font-semibold text-slate-800">Shift list</div>
          {myShifts.length === 0 ? (
            <div className="p-6 text-sm text-slate-500 italic">No shifts scheduled yet.</div>
          ) : (
            <table className="w-full text-sm">
              <thead className="bg-slate-50 text-left text-slate-600 text-xs uppercase">
                <tr>
                  <th className="px-4 py-2">Day</th>
                  <th className="px-4 py-2">Time (ET)</th>
                  <th className="px-4 py-2">Role</th>
                </tr>
              </thead>
              <tbody>
                {myShifts.map((s, i) => (
                  <tr key={i} className="border-t border-slate-100">
                    <td className="px-4 py-2 text-slate-700">{s.day.label}</td>
                    <td className="px-4 py-2 text-slate-700">{hourRangeLabel(s.hour)}</td>
                    <td className="px-4 py-2">
                      <span className={`inline-flex items-center px-2 py-0.5 rounded border text-xs ${ROLE_BY_ID[s.role] && ROLE_BY_ID[s.role].color}`}>
                        {ROLE_BY_ID[s.role] && ROLE_BY_ID[s.role].label}
                      </span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [session, setSession] = useState(() => loadJSON(LS_KEYS.session, null));
  useEffect(() => { seedIfEmpty(); }, []);
  function handleLogout() { localStorage.removeItem(LS_KEYS.session); setSession(null); }
  if (!session) return <LoginView onLogin={setSession} />;
  if (session.role === "admin") return <AdminApp session={session} onLogout={handleLogout} />;
  return <EmployeeApp session={session} onLogout={handleLogout} />;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
  </script>
</body>
