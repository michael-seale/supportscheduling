// Editable table of coverage needs keyed by (coverage role × hour). Writes
// flow through setNeeds, which persists to the shared JSON bin.
function CoverageNeedsEditor() {
  const { coverageRoles, needs, setNeeds } = useShared();
  const { hourRangeLabel } = useDisplayTz();
  const [collapsed, setCollapsed] = useState(true);

  function updateNeed(roleId, hour, rawValue) {
    const parsed = Math.max(0, Math.floor(Number(rawValue) || 0));
    setNeeds(prev => {
      const prevRole = (prev && prev[roleId]) || {};
      const nextRole = { ...prevRole };
      if (parsed === 0) delete nextRole[hour];
      else nextRole[hour] = parsed;
      const next = { ...(prev || {}) };
      if (Object.keys(nextRole).length === 0) delete next[roleId];
      else next[roleId] = nextRole;
      return next;
    });
  }

  return (
    <div className="mt-6">
      <div className="mb-2 flex items-end justify-between flex-wrap gap-2">
        <div>
          <button
            type="button"
            onClick={() => setCollapsed(v => !v)}
            className="inline-flex items-center gap-1.5 text-base font-semibold text-slate-800 hover:text-slate-600"
            aria-expanded={!collapsed}
            title={collapsed ? "Expand coverage needs" : "Collapse coverage needs"}
          >
            <span className={`inline-block transition-transform ${collapsed ? "" : "rotate-90"}`}>▸</span>
            <span>Coverage needs</span>
          </button>
          {!collapsed && (
            <p className="text-sm text-slate-500 mt-1">How many people each coverage role needs at each hour. Zero means optional.</p>
          )}
        </div>
      </div>
      {collapsed ? null : coverageRoles.length === 0 ? (
        <div className="bg-amber-50 border border-amber-200 text-amber-800 rounded-xl p-4 text-sm">
          No coverage roles yet. Mark a role as "Needs coverage" above to edit its targets here.
        </div>
      ) : (
        <div className="bg-white rounded-xl border border-slate-200 overflow-x-auto">
          <table className="w-full text-sm border-collapse">
            <thead>
              <tr>
                <th className="bg-slate-50 border-b border-slate-200 p-2 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide sticky left-0 z-10 w-[140px]">Role</th>
                {HOURS.map(h => (
                  <th key={h} className="bg-slate-50 border-b border-l border-slate-200 p-2 text-center text-[11px] font-semibold text-slate-600 whitespace-nowrap">
                    {hourRangeLabel(h)}
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {coverageRoles.map(r => (
                <tr key={r.id} className="border-t border-slate-200">
                  <td className="p-2 bg-white sticky left-0 z-10 border-r border-slate-200 whitespace-nowrap">
                    <span className={`inline-flex items-center px-2 py-0.5 rounded border text-xs font-semibold ${r.solid}`}>
                      {r.label}
                    </span>
                  </td>
                  {HOURS.map(h => {
                    const val = getNeed(needs, r.id, h);
                    return (
                      <td key={h} className="p-1 border-l border-slate-200 text-center">
                        <input
                          type="number"
                          min="0"
                          value={val}
                          onChange={e => updateNeed(r.id, h, e.target.value)}
                          className={`w-12 text-center text-sm rounded border px-1 py-1 focus:outline-none focus:ring-2 focus:ring-blue-400 ${val > 0 ? "border-slate-300 bg-white text-slate-800" : "border-slate-200 bg-slate-50 text-slate-400"}`}
                        />
                      </td>
                    );
                  })}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function ReportsTab() {
  const { users, roles, schedule: fullSchedule } = useShared();
  const [weekStart, setWeekStart] = useState(() => getMondayOf(new Date()));
  // Default to the rolled-up Groups view so the report opens clean; the toggle
  // in the top-right swaps to the detailed per-role breakdown.
  const [viewMode, setViewMode] = useState("groups"); // "groups" | "roles"
  const weekKey = toDateKey(weekStart);
  const weekSchedule = fullSchedule[weekKey] || {};

  // Count hours per (username, roleId) for the selected week.
  // Also collect any orphan role IDs that appear in assignments but don't
  // match an existing role so we can show them in a trailing "Other" column.
  const { hoursByUser, totalsByRole, grandTotal, orphanRoleIds } = useMemo(() => {
    const hoursByUser = {};
    const totalsByRole = {};
    const knownIds = new Set(roles.map(r => r.id));
    const orphans = new Set();
    let grand = 0;
    DAYS.forEach(d => {
      HOURS.forEach(h => {
        const assigns = (weekSchedule[d.id] && weekSchedule[d.id][h]) || [];
        assigns.forEach(a => {
          if (!hoursByUser[a.username]) hoursByUser[a.username] = {};
          hoursByUser[a.username][a.role] = (hoursByUser[a.username][a.role] || 0) + 1;
          totalsByRole[a.role] = (totalsByRole[a.role] || 0) + 1;
          grand += 1;
          if (!knownIds.has(a.role)) orphans.add(a.role);
        });
      });
    });
    return {
      hoursByUser,
      totalsByRole,
      grandTotal: grand,
      orphanRoleIds: Array.from(orphans),
    };
  }, [weekSchedule, roles]);

  // Columns shown in the table. In "roles" mode it's one column per role plus
  // one per orphan role ID. In "groups" mode it's one column per named group
  // (e.g. Chat Group, Phone Group) plus an "Ungrouped" column that absorbs
  // both ungrouped roles and orphan role assignments so no hours get lost.
  const displayColumns = useMemo(() => {
    if (viewMode === "roles") {
      return [
        ...roles.map(r => ({
          key: r.id,
          label: r.label,
          roleIds: [r.id],
          solid: r.solid,
          isOrphan: false,
        })),
        ...orphanRoleIds.map(id => ({
          key: id,
          label: id,
          roleIds: [id],
          solid: "bg-slate-400 text-white border-slate-500",
          isOrphan: true,
        })),
      ];
    }
    const byGroup = groupRolesByGroup(roles);
    const cols = byGroup.map(g => ({
      key: g.name || "__ungrouped__",
      label: g.name || "Ungrouped",
      roleIds: g.roles.map(r => r.id),
      isGroup: true,
    }));
    if (orphanRoleIds.length > 0) {
      const ungrouped = cols.find(c => c.key === "__ungrouped__");
      if (ungrouped) {
        ungrouped.roleIds = [...ungrouped.roleIds, ...orphanRoleIds];
      } else {
        cols.push({
          key: "__ungrouped__",
          label: "Ungrouped",
          roleIds: [...orphanRoleIds],
          isGroup: true,
        });
      }
    }
    return cols;
  }, [viewMode, roles, orphanRoleIds]);

  // Sum hours for a column (roleIds) from a per-role hours map.
  function columnHoursForRow(row, col) {
    return col.roleIds.reduce((n, rid) => n + (row[rid] || 0), 0);
  }

  function userTotal(username) {
    const row = hoursByUser[username] || {};
    return Object.values(row).reduce((a, b) => a + b, 0);
  }

  return (
    <div>
      <div className="mb-4 flex items-end justify-between gap-3 flex-wrap">
        <div>
          <h2 className="text-lg font-semibold text-slate-800">
            Hours by employee and {viewMode === "groups" ? "group" : "role"}
          </h2>
          <p className="text-sm text-slate-500">
            One point = one assigned hour. Totals roll up all assignments (coverage and non-coverage) for the selected week.
          </p>
        </div>
        <div className="flex items-center gap-2">
          {/* Groups vs. Roles view toggle (top right, matches the rest of the app). */}
          <div className="inline-flex rounded-md border border-slate-300 bg-white p-0.5 text-xs">
            <button
              type="button"
              onClick={() => setViewMode("groups")}
              className={`px-3 py-1 rounded transition ${
                viewMode === "groups"
                  ? "bg-blue-600 text-white font-medium"
                  : "text-slate-600 hover:bg-slate-50"
              }`}
            >
              Groups
            </button>
            <button
              type="button"
              onClick={() => setViewMode("roles")}
              className={`px-3 py-1 rounded transition ${
                viewMode === "roles"
                  ? "bg-blue-600 text-white font-medium"
                  : "text-slate-600 hover:bg-slate-50"
              }`}
            >
              All roles
            </button>
          </div>
          <WeekSelector weekStart={weekStart} onChange={setWeekStart} />
        </div>
      </div>

      {users.length === 0 ? (
        <div className="bg-amber-50 border border-amber-200 text-amber-800 rounded-xl p-4 text-sm">
          Add users on the Employees tab first, then come back here to see their hours.
        </div>
      ) : (
        <div className="bg-white border border-slate-200 rounded-xl overflow-x-auto">
          <table className="w-full text-sm">
            <thead className="bg-slate-50 text-slate-600 text-xs uppercase">
              <tr>
                <th className="px-4 py-2 text-left sticky left-0 bg-slate-50 z-10">Employee</th>
                {displayColumns.map(col => (
                  <th key={col.key} className="px-3 py-2 text-center whitespace-nowrap">
                    {col.isGroup ? (
                      <span className="inline-flex items-center px-2 py-0.5 rounded border border-slate-200 bg-white text-[11px] font-semibold text-slate-700">
                        {col.label}
                      </span>
                    ) : (
                      <span className={`inline-flex items-center px-2 py-0.5 rounded border text-[11px] font-semibold ${col.solid}`}>
                        {col.label}{col.isOrphan ? " (deleted)" : ""}
                      </span>
                    )}
                  </th>
                ))}
                <th className="px-4 py-2 text-center font-semibold">Total</th>
              </tr>
            </thead>
            <tbody>
              {users.map(u => {
                const row = hoursByUser[u.username] || {};
                const total = userTotal(u.username);
                const shiftLabel = (SHIFT_BY_ID[getShiftOf(u)] || {}).label || "";
                return (
                  <tr key={u.username} className="border-t border-slate-100">
                    <td className="px-4 py-2 sticky left-0 bg-white whitespace-nowrap">
                      <span className="text-slate-800 font-medium">{u.displayName || u.username}</span>
                      {u.role === "admin" && (
                        <span className="ml-2 text-[10px] uppercase text-blue-700 bg-blue-50 border border-blue-200 rounded px-1 py-0.5">Admin</span>
                      )}
                      <span className="ml-2 text-[10px] uppercase text-slate-500 bg-slate-100 border border-slate-200 rounded px-1 py-0.5">{shiftLabel}</span>
                    </td>
                    {displayColumns.map(col => {
                      const v = columnHoursForRow(row, col);
                      return (
                        <td
                          key={col.key}
                          className={`px-3 py-2 text-center tabular-nums ${v > 0 ? "text-slate-800" : "text-slate-300"}`}
                        >
                          {v}
                        </td>
                      );
                    })}
                    <td className={`px-4 py-2 text-center font-semibold tabular-nums ${total > 0 ? "text-slate-900" : "text-slate-300"}`}>
                      {total}
                    </td>
                  </tr>
                );
              })}
            </tbody>
            <tfoot>
              <tr className="bg-slate-50 border-t border-slate-200">
                <td className="px-4 py-2 text-slate-600 text-xs uppercase tracking-wide sticky left-0 bg-slate-50">Total</td>
                {displayColumns.map(col => {
                  const colTotal = col.roleIds.reduce((n, rid) => n + (totalsByRole[rid] || 0), 0);
                  return (
                    <td key={col.key} className="px-3 py-2 text-center font-semibold tabular-nums text-slate-700">
                      {colTotal}
                    </td>
                  );
                })}
                <td className="px-4 py-2 text-center font-bold tabular-nums text-slate-900">{grandTotal}</td>
              </tr>
            </tfoot>
          </table>
        </div>
      )}
    </div>
  );
}

function AdminApp({ session, onLogout }) {
  const { users, setUsers, roles, schedule: fullSchedule, setSchedule: setFullSchedule } = useShared();
  const [tab, setTab] = useState("schedule");
  const employees = useMemo(() => sortEmployeesByFirstName(users), [users]);
  const [previewUsername, setPreviewUsername] = useState("");
  const [scheduleView, setScheduleView] = useState("day");
  const [weekStart, setWeekStart] = useState(() => getMondayOf(new Date()));
  const [deptFilter, setDeptFilter] = useState("");
  const weekKey = toDateKey(weekStart);
  const weekSchedule = fullSchedule[weekKey] || {};

  function setWeekSchedule(nextOrFn) {
    setFullSchedule(prev => {
      const current = prev[weekKey] || {};
      const next = typeof nextOrFn === "function" ? nextOrFn(current) : nextOrFn;
      const copy = { ...prev };
      if (!next || Object.keys(next).length === 0) delete copy[weekKey];
      else copy[weekKey] = next;
      return copy;
    });
  }

  // Employees filtered by the selected department. Still includes anyone from
  // other departments who's assigned to a role linked to this department this
  // week (e.g. a Sales rep doing Chat), so the schedule never hides people who
  // are actively covering another department's work.
  const filteredEmployees = useMemo(() =>
    filterEmployeesByDepartmentWeek(employees, deptFilter, roles, weekSchedule),
    [employees, deptFilter, roles, weekSchedule]
  );

  // Default the preview selector to the first employee once available
  useEffect(() => {
    if (!previewUsername && employees.length > 0) {
      setPreviewUsername(employees[0].username);
    }
  }, [employees, previewUsername]);

  return (
    <div className="min-h-screen bg-slate-50">
      <TopBar session={session} onLogout={onLogout} title="RenewedVision Support" />
      <div className="max-w-7xl mx-auto px-6 py-6">
        <div className="flex items-center justify-between gap-3 mb-4 border-b border-slate-200 flex-wrap">
          <div className="flex gap-1">
            <TabButton active={tab === "schedule"} onClick={() => setTab("schedule")}>Schedule</TabButton>
            <TabButton active={tab === "viewer"} onClick={() => setTab("viewer")}>Schedule Viewer</TabButton>
            <TabButton active={tab === "calendar"} onClick={() => setTab("calendar")}>Calendar</TabButton>
            <TabButton active={tab === "settings"} onClick={() => setTab("settings")}>Settings</TabButton>
          </div>
          {tab !== "settings" && tab !== "calendar" && (
            <div className="pb-2">
              <WeekSelector weekStart={weekStart} onChange={setWeekStart} />
            </div>
          )}
        </div>
        {tab === "schedule" && (
          <div>
            <div className="mb-3 flex items-center justify-between gap-3 flex-wrap">
              <div className="inline-flex rounded-md border border-slate-300 bg-white overflow-hidden">
                <button
                  onClick={() => setScheduleView("week")}
                  className={`px-3 py-1.5 text-sm font-medium ${scheduleView === "week" ? "bg-blue-600 text-white" : "text-slate-700 hover:bg-slate-50"}`}
                >Week view</button>
                <button
                  onClick={() => setScheduleView("day")}
                  className={`px-3 py-1.5 text-sm font-medium border-l border-slate-300 ${scheduleView === "day" ? "bg-blue-600 text-white" : "text-slate-700 hover:bg-slate-50"}`}
                >Daily view</button>
              </div>
              <DepartmentFilter value={deptFilter} onChange={setDeptFilter} />

            {scheduleView === "week"
              ? <ScheduleGrid schedule={weekSchedule} setSchedule={setWeekSchedule} employees={filteredEmployees} />

        {tab === "viewer" && (

            previewUsername={previewUsername}
            setPreviewUsername={setPreviewUsername}
          />
        )}
        {tab === "calendar" && <CalendarAdminExportPanel />}
        {tab === "settings" && <SettingsPage currentUsername={session.username} />}
      </div>
    </div>
  );
}

                        {(rolesById[s.role] && rolesById[s.role].label) || s.role}
                      </span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      )}
    </div>
  );
}

// Compute a rendering plan for the weekly grid of one employee.
// Returns plan[dayId][hour] = { type, role?, rowSpan, startHour } for cells
// that should render (as the start of a run), or null for cells that are
// covered by an earlier rowSpan-merged cell in the same column.
function buildEmployeeWeekPlan(schedule, username, shiftId) {
  const plan = {};
  DAYS.forEach(d => {
    plan[d.id] = {};
    let running = null;
    HOURS.forEach(h => {
      const inShift = isHourInShift(shiftId, h);
      if (!inShift) {
        if (running && running.type === "off" && running.endHour === h - 1) {
          running.rowSpan += 1;
          running.endHour = h;
          plan[d.id][h] = null;
        } else {
          running = { type: "off", role: "", rowSpan: 1, startHour: h, endHour: h };
          plan[d.id][h] = running;
        }
        return;
      }
      const assigns = getCellAssignments(schedule, d.id, h);
      const mine = assigns.find(a => a.username.toLowerCase() === username.toLowerCase());
      const role = mine ? mine.role : "";
      if (role && running && running.type === "assigned" && running.role === role && running.endHour === h - 1) {
        running.rowSpan += 1;
        running.endHour = h;
        plan[d.id][h] = null;
      } else {
        running = { type: "assigned", role, rowSpan: 1, startHour: h, endHour: h };
        plan[d.id][h] = running;
        if (!role) running = null; // empty in-shift hours don't merge
      }
    });
  });
  return plan;
}

function EmployeeGrid({ schedule, username, shiftId }) {
  const { rolesById } = useShared();
  const { formatHour, hourRangeLabel, tz } = useDisplayTz();
  const resolvedShift = shiftId || DEFAULT_SHIFT_ID;
  const plan = buildEmployeeWeekPlan(schedule, username, resolvedShift);
  return (
    <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
      <table className="w-full text-sm border-collapse">
        <thead>
          <tr>
            <th className="bg-slate-100 border-b border-slate-200 p-2 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide w-[90px]">Time ({tz.short})</th>
            {DAYS.map(d => (
              <th key={d.id} className="bg-slate-100 border-b border-l border-slate-200 p-2 text-sm font-semibold text-slate-700">{d.label}</th>
            ))}
          </tr>
        </thead>
        <tbody>
          {HOURS.map(h => (
            <tr key={h} className="border-t border-slate-200">
              <td className="p-2 text-xs text-slate-500 bg-slate-50 border-r border-slate-200 whitespace-nowrap align-top">{hourRangeLabel(h)}</td>
              {DAYS.map(d => {
                const cell = plan[d.id][h];
                if (cell === null) return null; // covered by rowSpan above
                if (cell.type === "off") {
                  return (
                    <td
                      key={d.id}
                      rowSpan={cell.rowSpan}
                      className="border-l border-slate-200 bg-slate-100 p-2 align-middle"
                    >
                      <div className="text-center text-[11px] text-slate-400 italic select-none">Off</div>
                    </td>
                  );
                }
                const roleObj = cell.role ? rolesById[cell.role] : null;
                if (!roleObj) {
                  return (
                    <td
                      key={d.id}
                      rowSpan={cell.rowSpan}
                      className="border-l border-slate-200 p-2 min-h-[40px] align-middle"
                    ></td>
                  );
                }
                return (
                  <td
                    key={d.id}
                    rowSpan={cell.rowSpan}
                    className={`border-l border-slate-200 align-middle p-0`}
                  >
                    <div className={`w-full h-full flex flex-col items-center justify-center text-center ${roleObj.solid} px-2 py-2 text-xs font-semibold`}>
                      <span>{roleObj.label}</span>
                      {cell.rowSpan > 1 && (
                        <span className="text-[10px] opacity-90 mt-0.5">
                          {formatHour(cell.startHour)}–{formatHour(cell.endHour + 1)} · {cell.rowSpan}h
                        </span>
                      )}
                    </div>
                  </td>
                );
              })}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function EmployeeDayStrip({ schedule, username, shiftId, dayId, setDayId }) {
  const { rolesById } = useShared();
  const { formatHour, hourRangeLabel } = useDisplayTz();
  const resolvedShift = shiftId || DEFAULT_SHIFT_ID;
  // Build runs across HOURS for this employee/day, merging same-role hours and
  // off-shift hours separately.
  const runs = useMemo(() => {
    const r = [];
    let current = null;
    HOURS.forEach(h => {
      const inShift = isHourInShift(resolvedShift, h);
      if (!inShift) {
        if (current && current.type === "off" && current.endHour === h - 1) {
          current.endHour = h;
        } else {
          current = { type: "off", role: "", startHour: h, endHour: h };
          r.push(current);
        }
        return;
      }
      const assigns = getCellAssignments(schedule, dayId, h);
      const mine = assigns.find(a => a.username.toLowerCase() === username.toLowerCase());
      const role = mine ? mine.role : "";
      if (role && current && current.type === "assigned" && current.role === role && current.endHour === h - 1) {
        current.endHour = h;
      } else {
        current = { type: "assigned", role, startHour: h, endHour: h };
        r.push(current);
        if (!role) current = null;
      }
    });
    return r;
  }, [schedule, username, dayId, resolvedShift]);

  return (
    <div>
      <div className="flex flex-wrap gap-1 mb-3">
        {DAYS.map(d => (
          <button
            key={d.id}
            onClick={() => setDayId(d.id)}
            className={`px-3 py-1.5 rounded-md text-sm font-medium transition ${
              dayId === d.id
                ? "bg-blue-600 text-white"
                : "bg-white border border-slate-300 text-slate-700 hover:bg-slate-50"
            }`}
          >
            {d.label}
          </button>
        ))}
      </div>
      <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-x-auto">
        <table className="w-full text-sm border-collapse">
          <thead>
            <tr>
              {HOURS.map(h => (
                <th key={h} className="bg-slate-100 border-b border-l first:border-l-0 border-slate-200 p-2 text-center text-[11px] font-semibold text-slate-600 whitespace-nowrap">
                  {hourRangeLabel(h)}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            <tr>
              {runs.map(run => {
                const span = run.endHour - run.startHour + 1;
                if (run.type === "off") {
                  return (
                    <td
                      key={run.startHour}
                      colSpan={span}
                      className="border-t border-l first:border-l-0 border-slate-200 bg-slate-100 p-3 align-middle"
                    >
                      <div className="text-center text-[11px] text-slate-400 italic select-none">Off</div>
                    </td>
                  );
                }
                const roleObj = run.role ? rolesById[run.role] : null;
                if (!roleObj) {
                  return (
                    <td
                      key={run.startHour}
                      colSpan={span}
                      className="border-t border-l first:border-l-0 border-slate-200 p-3 align-middle"
                    >
                      <div className="text-center text-[11px] text-slate-300">—</div>
                    </td>
                  );
                }
                return (
                  <td
                    key={run.startHour}
                    colSpan={span}
                    className="border-t border-l first:border-l-0 border-slate-200 p-0 align-middle"
                  >
                    <div className={`w-full h-full ${roleObj.solid} px-3 py-3 text-center text-xs font-semibold`}>
                      <span>{roleObj.label}</span>
                      {span > 1 && (
                        <span className="ml-2 text-[10px] opacity-90">
                          {formatHour(run.startHour)}–{formatHour(run.endHour + 1)} · {span}h
                        </span>
                      )}
                    </div>
                  </td>
                );
              })}
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  );
}

// Read-only week grid showing everyone's schedule (days as columns, hours as
// rows, each cell lists who is assigned to what role). Used by the Employee
// view when the "Show everyone" toggle is on.
function TeamWeekGrid({ schedule, users, highlightUsername }) {
  const { rolesById } = useShared();
  const { hourRangeLabel, tz } = useDisplayTz();
  // Precompute per-cell assignments decorated with display names.
  const cells = useMemo(() => {
    const nameByUsername = {};
    users.forEach(u => { nameByUsername[u.username.toLowerCase()] = u.displayName || u.username; });
    const out = {};
    DAYS.forEach(d => {
      out[d.id] = {};
      HOURS.forEach(h => {
        const assigns = getCellAssignments(schedule, d.id, h);
        // Group by role so the cell renders one pill per role with names under it.
        const byRole = {};
        assigns.forEach(a => {
          if (!byRole[a.role]) byRole[a.role] = [];
          byRole[a.role].push({
            username: a.username,
            display: nameByUsername[a.username.toLowerCase()] || a.username,
            isMe: highlightUsername && a.username.toLowerCase() === highlightUsername.toLowerCase(),
          });
        });
        out[d.id][h] = byRole;
      });
    });
    return out;
  }, [schedule, users, highlightUsername]);

  return (
    <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-x-auto">
      <table className="w-full text-sm border-collapse">
        <thead>
          <tr>
            <th className="bg-slate-100 border-b border-slate-200 p-2 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide w-[90px]">Time ({tz.short})</th>
            {DAYS.map(d => (
              <th key={d.id} className="bg-slate-100 border-b border-l border-slate-200 p-2 text-sm font-semibold text-slate-700">{d.label}</th>
            ))}
          </tr>
        </thead>
        <tbody>
          {HOURS.map(h => (
            <tr key={h} className="border-t border-slate-200">
              <td className="p-2 text-xs text-slate-500 bg-slate-50 border-r border-slate-200 whitespace-nowrap align-top">{hourRangeLabel(h)}</td>
              {DAYS.map(d => {
                const byRole = cells[d.id][h];
                const roleIds = Object.keys(byRole);
                return (
                  <td key={d.id} className="border-l border-slate-200 p-1.5 align-top min-h-[56px]">
                    {roleIds.length === 0 ? (
                      <div className="text-[11px] text-slate-300">—</div>
                    ) : (
                      <div className="flex flex-col gap-1">
                        {roleIds.map(rid => {
                          const role = rolesById[rid];
                          const pillClass = (role && role.solid) || "bg-slate-400 text-white border-slate-500";
                          return (
                            <div key={rid} className={`rounded border ${pillClass} px-1.5 py-0.5`}>
                              <div className="text-[10px] font-semibold uppercase tracking-wide opacity-90">
                                {(role && role.label) || rid}
                              </div>
                              <div className="text-[11px] leading-tight">
                                {byRole[rid].map((p, i) => (
                                  <span key={p.username}>
                                    <span className={p.isMe ? "font-bold underline" : ""}>{p.display}</span>
                                    {i < byRole[rid].length - 1 ? ", " : ""}
                                  </span>
                                ))}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </td>
                );
              })}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

// Read-only team daily grid. Mirrors the admin Daily view (employees as rows,
// hours as columns, colored role pills per run) but without the coverage
// section and without the role-picker dropdowns. Used for "Show Everyone" on
// the Employee view and the Schedule Viewer.
function TeamDailyGrid({ schedule, users, highlightUsername }) {
  const { formatHour, hourRangeLabel } = useDisplayTz();
  const { rolesById } = useShared();
  const [dayId, setDayId] = useState("mon");
  const dayLabel = (DAYS.find(d => d.id === dayId) || {}).label;

  // Merge consecutive same-role hours into a single run (same logic as the
  // admin view), plus merge off-shift hours into one "off" run.
  function getRunsForEmployee(username, shiftId) {
    const runs = [];
    let current = null;
    HOURS.forEach(h => {
      const inShift = isHourInShift(shiftId, h);
      if (!inShift) {
        if (current && current.type === "off" && current.endHour === h - 1) {
          current.endHour = h;
        } else {
          current = { type: "off", startHour: h, endHour: h, role: "" };
          runs.push(current);
        }
        return;
      }
      const assigns = getCellAssignments(schedule, dayId, h);
      const mine = assigns.find(a => a.username.toLowerCase() === username.toLowerCase());
      const role = mine ? mine.role : "";
      if (role && current && current.type === "assigned" && current.role === role && current.endHour === h - 1) {
        current.endHour = h;
      } else {
        current = { type: "assigned", startHour: h, endHour: h, role };
        runs.push(current);
        if (!role) current = null; // don't merge empty cells
      }
    });
    return runs;
  }

  // Only keep users who actually have an assignment on the selected day.
  // (If an employee is off that day, they shouldn't fill up a row.)
  const scheduledUsers = useMemo(() => {
    const assigned = new Set();
    HOURS.forEach(h => {
      getCellAssignments(schedule, dayId, h).forEach(a => {
        assigned.add(a.username.toLowerCase());
      });
    });
    return users.filter(u => assigned.has(u.username.toLowerCase()));
  }, [schedule, users, dayId]);

  return (
    <div>
      {/* Day picker */}
      <div className="flex flex-wrap gap-1 mb-3">
        {DAYS.map(d => (
          <button
            key={d.id}
            onClick={() => setDayId(d.id)}
            className={`px-3 py-1.5 rounded-md text-sm font-medium transition ${
              dayId === d.id
                ? "bg-blue-600 text-white"
                : "bg-white border border-slate-300 text-slate-700 hover:bg-slate-50"
            }`}
          >
            {d.label}
          </button>
        ))}
      </div>

      {scheduledUsers.length === 0 ? (
        <div className="bg-slate-50 border border-slate-200 text-slate-600 rounded-xl p-4 text-sm">
          No one is scheduled on {dayLabel}.
        </div>
      ) : (
        <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-x-auto">
          <table className="w-full text-sm border-collapse">
            <thead>
              <tr>
                <th className="bg-slate-100 border-b border-slate-200 p-2 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide sticky left-0 z-20">
                  {dayLabel}
                </th>
                {HOURS.map(h => (
                  <th key={h} className="bg-slate-100 border-b border-l border-slate-200 p-2 text-center text-xs font-semibold text-slate-700 whitespace-nowrap">
                    {hourRangeLabel(h)}
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {scheduledUsers.map(emp => {
                const shiftId = getShiftOf(emp);
                const runs = getRunsForEmployee(emp.username, shiftId);
                const shiftLabel = (SHIFT_BY_ID[shiftId] || {}).label || "";
                const isMe = highlightUsername && emp.username.toLowerCase() === highlightUsername.toLowerCase();
                return (
                  <tr key={emp.username} className="border-t border-slate-200">
                    <td className={`p-2 ${isMe ? "bg-blue-50" : "bg-white"} border-r border-slate-200 font-medium text-slate-700 sticky left-0 z-10 whitespace-nowrap`}>
                      <span className={isMe ? "font-bold underline" : ""}>
                        {emp.displayName || emp.username}
                      </span>
                      {emp.role === "admin" && (
                        <span className="ml-2 text-[10px] uppercase text-blue-700 bg-blue-50 border border-blue-200 rounded px-1 py-0.5">Admin</span>
                      )}
                      <span className="ml-2 text-[10px] uppercase text-slate-500 bg-slate-100 border border-slate-200 rounded px-1 py-0.5">{shiftLabel}</span>
                    </td>
                    {runs.map(run => {
                      const span = run.endHour - run.startHour + 1;
                      if (run.type === "off") {
                        return (
                          <td
                            key={run.startHour}
                            colSpan={span}
                            className="p-1 border-l border-slate-200 bg-slate-100 align-middle"
                            title={`Off shift — ${shiftLabel}`}
                          >
                            <div className="text-center text-[11px] text-slate-400 italic select-none">Off</div>
                          </td>
                        );
                      }
                      const roleObj = run.role ? rolesById[run.role] : null;
                      if (!roleObj) {
                        return (
                          <td
                            key={run.startHour}
                            colSpan={span}
                            className="p-1 border-l border-slate-200 align-middle"
                          >
                            <div className="text-center text-[11px] text-slate-300">—</div>
                          </td>
                        );
                      }
                      const isMulti = span > 1;
                      return (
                        <td
                          key={run.startHour}
                          colSpan={span}
                          className="p-1 border-l border-slate-200 align-middle"
                        >
                          <div className={`${roleObj.solid} border rounded w-full text-xs font-semibold text-center ${isMulti ? "px-2 py-1.5" : "px-1 py-1"}`}>
                            <span>{roleObj.label}</span>
                            {isMulti && (
                              <span className="ml-2 text-[10px] opacity-90">
                                {formatHour(run.startHour)}–{formatHour(run.endHour + 1)} · {span}h
                              </span>
                            )}
                          </div>
                        </td>
                      );
                    })}
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function EmployeeApp({ session, onLogout }) {
  const { users, roles, schedule: fullSchedule, rolesById } = useShared();
  const { tz, formatHour } = useDisplayTz();
  const [weekStart, setWeekStart] = useState(() => getMondayOf(new Date()));
  const [showEveryone, setShowEveryone] = useState(true);
  const [viewerView, setViewerView] = useState("day");
  const [viewerDayId, setViewerDayId] = useState("mon");
  const [deptFilter, setDeptFilter] = useState("");
  const [showCalendarModal, setShowCalendarModal] = useState(false);
  const weekKey = toDateKey(weekStart);
  const schedule = fullSchedule[weekKey] || {};
  const sortedUsers = useMemo(() => sortEmployeesByFirstName(users), [users]);
  const filteredUsers = useMemo(() =>
    filterEmployeesByDepartmentWeek(sortedUsers, deptFilter, roles, schedule),
    [sortedUsers, deptFilter, roles, schedule]
  );
  const mySelf = users.find(u => u.username.toLowerCase() === session.username.toLowerCase());
  const myShiftId = getShiftOf(mySelf);
  const myShifts = useMemo(() => {
    const rows = [];
    DAYS.forEach(d => {
      HOURS.forEach(h => {
        const assigns = getCellAssignments(schedule, d.id, h);
        assigns.filter(a => a.username.toLowerCase() === session.username.toLowerCase())
          .forEach(a => rows.push({ day: d, hour: h, role: a.role }));
      });
    });
    return rows;
  }, [schedule, session.username]);

  const todayMon = getMondayOf(new Date());
  const weekLabel = toDateKey(weekStart) === toDateKey(todayMon)
    ? "This week"
    : formatWeekRange(weekStart);

  return (
    <div className="min-h-screen bg-slate-50">
      <TopBar session={session} onLogout={onLogout} title="RenewedVision Support" />
      <div className="max-w-7xl mx-auto px-6 py-6">
        <div className="mb-4 flex items-end justify-between gap-3 flex-wrap">
          <div>
            <h2 className="text-xl font-semibold text-slate-800">{weekLabel}</h2>
            <p className="text-sm text-slate-500">Monday–Friday, {formatHour(7)}–{formatHour(20)} {tz.short} · times shown in {tz.label} Time</p>
          </div>
          <div className="flex items-center gap-3 flex-wrap justify-end">
            <span className="text-sm text-slate-600">{myShifts.length} shift{myShifts.length === 1 ? "" : "s"} assigned</span>
            <button
              type="button"
              onClick={() => setShowCalendarModal(true)}
              className="text-sm px-3 py-1.5 rounded-md border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 font-medium"
              title="Send your shifts to Google Calendar, Apple Calendar, or Outlook"
            >
              Send to calendar
            </button>
            <WeekSelector weekStart={weekStart} onChange={setWeekStart} />
            <label className="flex items-center gap-2 text-sm text-slate-700 bg-white border border-slate-300 rounded-md px-2 py-1 cursor-pointer select-none">
              <span>Show everyone</span>
              <button
                type="button"
                role="switch"
                aria-checked={showEveryone}
                onClick={() => setShowEveryone(v => !v)}
                className={`relative inline-flex h-5 w-9 items-center rounded-full transition ${showEveryone ? "bg-blue-600" : "bg-slate-300"}`}
              >
                <span className={`inline-block h-4 w-4 transform rounded-full bg-white shadow transition ${showEveryone ? "translate-x-4" : "translate-x-0.5"}`} />
              </button>
            </label>
          </div>
        </div>

        <div className="mb-3 flex items-center gap-3 flex-wrap">
          <div className="inline-flex rounded-md border border-slate-300 bg-white overflow-hidden">
            <button
              onClick={() => setViewerView("week")}
              className={`px-3 py-1.5 text-sm font-medium ${viewerView === "week" ? "bg-blue-600 text-white" : "text-slate-700 hover:bg-slate-50"}`}
            >Week view</button>
            <button
              onClick={() => setViewerView("day")}
              className={`px-3 py-1.5 text-sm font-medium border-l border-slate-300 ${viewerView === "day" ? "bg-blue-600 text-white" : "text-slate-700 hover:bg-slate-50"}`}
            >Daily view</button>
          </div>
          {showEveryone && <DepartmentFilter value={deptFilter} onChange={setDeptFilter} />}
          {!showEveryone && (
            <div className="text-xs text-slate-500">
              Shift: <span className="font-medium text-slate-700">{(SHIFT_BY_ID[myShiftId] || {}).label}</span>
            </div>
          )}
        </div>

        {showEveryone ? (
          viewerView === "week"
            ? <TeamWeekGrid schedule={schedule} users={filteredUsers} highlightUsername={session.username} />
            : <TeamDailyGrid schedule={schedule} users={filteredUsers} highlightUsername={session.username} />
        ) : (
          viewerView === "week"
            ? <EmployeeGrid schedule={schedule} username={session.username} shiftId={myShiftId} />
            : <EmployeeDayStrip schedule={schedule} username={session.username} shiftId={myShiftId} dayId={viewerDayId} setDayId={setViewerDayId} />
        )}
      </div>
      {showCalendarModal && (
        <CalendarSelfExportModal
          username={session.username}
          onClose={() => setShowCalendarModal(false)}
        />
      )}
    </div>
  );
}

function SetupView() {
  return (
    <div className="min-h-screen bg-slate-50 flex items-center justify-center p-6">
      <div className="bg-white shadow-md rounded-xl p-8 w-full max-w-xl border border-slate-200">
        <h1 className="text-2xl font-semibold text-slate-800 mb-2">Team Scheduler — Setup needed</h1>
        <p className="text-sm text-slate-600 mb-4">
          This app shares its schedule across users via a free JSONBin.io bin. Before the app can load, the person hosting this file needs to fill in two values near the top of the HTML:
        </p>
        <ol className="list-decimal list-inside text-sm text-slate-700 space-y-1 mb-4">
          <li>Create a free account at <span className="font-mono">jsonbin.io</span>.</li>
          <li>Create a new bin with this initial content:
            <pre className="bg-slate-100 border border-slate-200 rounded-md p-3 mt-1 text-[11px] overflow-x-auto">{`{
  "users": [
    { "username": "admin", "password": "admin123",
      "role": "admin", "displayName": "Admin", "shift": "eastern" }
  ],
  "schedule": {},
  "version": 0
}`}</pre>
          </li>
          <li>Open the HTML file, find <span className="font-mono">JSONBIN_CONFIG</span>, and paste in your Bin ID and X-Master-Key.</li>
          <li>Save and reload.</li>
        </ol>
        <p className="text-xs text-slate-500">
          The master key will be visible in the HTML source. That's fine for a trusted internal team with no sensitive data — just don't reuse that key for other bins you care about.
        </p>
      </div>
    </div>
  );
}

function LoadingView({ message }) {
  return (
    <div className="min-h-screen bg-slate-50 flex items-center justify-center p-6">
      <div className="text-sm text-slate-500">{message || "Loading…"}</div>
    </div>
  );
}

function ConnectionBadge() {
  const { writing, error, lastSync, refreshNow } = useShared();
  let label, color;
  if (error) { label = "Offline"; color = "bg-red-50 text-red-700 border-red-200"; }
  else if (writing) { label = "Saving…"; color = "bg-blue-50 text-blue-700 border-blue-200"; }
  else { label = "Synced"; color = "bg-green-50 text-green-700 border-green-200"; }
  const syncText = lastSync ? new Date(lastSync).toLocaleTimeString() : "—";
  const title = error
    ? `${error}\nLast successful sync: ${syncText}\nClick to retry.`
    : `Last sync: ${syncText}\nClick to refresh now.`;
  return (
    <button
      onClick={refreshNow}
      title={title}
      className={`text-[11px] font-medium border rounded-full px-2 py-0.5 ${color} hover:opacity-80 transition`}
    >
      {label}
    </button>
  );
}

function AppInner() {
  const { loading, error, users } = useShared();
  const [session, setSession] = useState(() => loadJSON(LS_KEYS.session, null));

  // If the signed-in user no longer exists in the shared user list, sign out.
  useEffect(() => {
    if (!session || loading) return;
    const stillExists = users.some(u => u.username.toLowerCase() === session.username.toLowerCase());
    if (!stillExists) {
      localStorage.removeItem(LS_KEYS.session);
      setSession(null);
    }
  }, [users, loading, session]);

  function handleLogout() { localStorage.removeItem(LS_KEYS.session); setSession(null); }

  if (loading) return <LoadingView message="Connecting to shared schedule…" />;
  if (error && users.length === 0) {
    return (
      <div className="min-h-screen bg-slate-50 flex items-center justify-center p-6">
        <div className="bg-white shadow-md rounded-xl p-8 w-full max-w-md border border-red-200">
          <h1 className="text-xl font-semibold text-red-700 mb-2">Couldn't reach shared storage</h1>
          <p className="text-sm text-slate-600 mb-4">{error}</p>
          <p className="text-xs text-slate-500">Check the Bin ID and API key near the top of the HTML, and that the device is online.</p>
        </div>
      </div>
    );
  }
  if (!session) return <LoginView onLogin={setSession} />;
  if (session.role === "admin") return <AdminApp session={session} onLogout={handleLogout} />;
  return <EmployeeApp session={session} onLogout={handleLogout} />;
}

function App() {
  if (!isJsonbinConfigured()) return <SetupView />;
  return (
    <DisplayTzProvider>
      <SharedStateProvider>
        <AppInner />
      </SharedStateProvider>
    </DisplayTzProvider>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
  </script>
</body>
</html>
