<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RenewedVision Support</title>

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Plus Jakarta Sans (brand font for top bar) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <!-- React + ReactDOM (UMD) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    html, body, #root { height: 100%; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-brand { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; letter-spacing: -0.01em; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

// Color palette for roles. Classes are pre-baked so Tailwind's CDN JIT picks
// them up (it can't handle arbitrary runtime-generated class names).
// Each palette entry has:
//   base  — muted background used on badge pills
//   solid — filled color used when a cell is "assigned" or a pill is "met"
//   light — washed color used for partial / empty-with-need states
//   swatch — a small bg-only class for color-picker swatches
const COLOR_PALETTE = {
  orange: { base: "bg-orange-100 text-orange-800 border-orange-300", solid: "bg-orange-500 text-white border-orange-600", light: "bg-orange-50 text-orange-700 border-orange-300", swatch: "bg-orange-500" },
  blue:   { base: "bg-blue-100 text-blue-800 border-blue-300",       solid: "bg-blue-600 text-white border-blue-700",     light: "bg-blue-50 text-blue-700 border-blue-300",       swatch: "bg-blue-600" },
  green:  { base: "bg-green-100 text-green-800 border-green-300",    solid: "bg-green-600 text-white border-green-700",   light: "bg-green-50 text-green-700 border-green-300",    swatch: "bg-green-600" },
  purple: { base: "bg-purple-100 text-purple-800 border-purple-300", solid: "bg-purple-600 text-white border-purple-700", light: "bg-purple-50 text-purple-700 border-purple-300", swatch: "bg-purple-600" },
  red:    { base: "bg-red-100 text-red-800 border-red-300",          solid: "bg-red-600 text-white border-red-700",       light: "bg-red-50 text-red-700 border-red-300",          swatch: "bg-red-600" },
  yellow: { base: "bg-yellow-100 text-yellow-800 border-yellow-300", solid: "bg-yellow-500 text-white border-yellow-600", light: "bg-yellow-50 text-yellow-700 border-yellow-300", swatch: "bg-yellow-500" },
  pink:   { base: "bg-pink-100 text-pink-800 border-pink-300",       solid: "bg-pink-600 text-white border-pink-700",     light: "bg-pink-50 text-pink-700 border-pink-300",       swatch: "bg-pink-600" },
  indigo: { base: "bg-indigo-100 text-indigo-800 border-indigo-300", solid: "bg-indigo-600 text-white border-indigo-700", light: "bg-indigo-50 text-indigo-700 border-indigo-300", swatch: "bg-indigo-600" },
  teal:   { base: "bg-teal-100 text-teal-800 border-teal-300",       solid: "bg-teal-600 text-white border-teal-700",     light: "bg-teal-50 text-teal-700 border-teal-300",       swatch: "bg-teal-600" },
  slate:  { base: "bg-slate-100 text-slate-800 border-slate-300",    solid: "bg-slate-600 text-white border-slate-700",   light: "bg-slate-50 text-slate-700 border-slate-300",    swatch: "bg-slate-600" },
};
const COLOR_NAMES = Object.keys(COLOR_PALETTE);
const DEFAULT_COLOR = "slate";

// Default roles used only when the shared bin has no `roles` array yet.
const DEFAULT_ROLES = [
  { id: "chat",    label: "Chat",    isCoverage: true,  color: "orange" },
  { id: "phone",   label: "Phone",   isCoverage: true,  color: "blue" },
  { id: "email",   label: "Email",   isCoverage: true,  color: "green" },
  { id: "lunch",   label: "Lunch",   isCoverage: false, color: "purple" },
  { id: "meeting", label: "Meeting", isCoverage: false, color: "red" },
];

// Decorate a role (id/label/isCoverage/color) with the class strings the UI
// expects (color/solid/light) by looking up the palette.
function decorateRole(role) {
  const pal = COLOR_PALETTE[role.color] || COLOR_PALETTE[DEFAULT_COLOR];
  return {
    ...role,
    color: pal.base,
    solid: pal.solid,
    light: pal.light,
    colorName: role.color || DEFAULT_COLOR,
  };
}

// Slugify a label into a stable, filesystem-safe ID.
function slugifyRoleId(label, existingIds) {
  const base = String(label).trim().toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "")
    .slice(0, 30) || "role";
  if (!existingIds.includes(base)) return base;
  for (let n = 2; n < 1000; n++) {
    const candidate = `${base}-${n}`;
    if (!existingIds.includes(candidate)) return candidate;
  }
  return `${base}-${Date.now()}`;
}

const DAYS = [
  { id: "mon", label: "Monday" },
  { id: "tue", label: "Tuesday" },
  { id: "wed", label: "Wednesday" },
  { id: "thu", label: "Thursday" },
  { id: "fri", label: "Friday" },
];

const HOURS = Array.from({ length: 13 }, (_, i) => 7 + i);

const SHIFTS = [
  { id: "atlantic", label: "Atlantic", startHour: 7,  endHour: 15 }, // 7am-4pm ET
  { id: "eastern",  label: "Eastern",  startHour: 8,  endHour: 16 }, // 8am-5pm
  { id: "central",  label: "Central",  startHour: 9,  endHour: 17 }, // 9am-6pm
  { id: "mountain", label: "Mountain", startHour: 10, endHour: 18 }, // 10am-7pm
  { id: "pacific",  label: "Pacific",  startHour: 11, endHour: 19 }, // 11am-8pm
];
const SHIFT_BY_ID = Object.fromEntries(SHIFTS.map(s => [s.id, s]));
const DEFAULT_SHIFT_ID = "eastern";
function getShiftOf(user) {
  return (user && user.shift && SHIFT_BY_ID[user.shift]) ? user.shift : DEFAULT_SHIFT_ID;
}
function isHourInShift(shiftId, hour) {
  const s = SHIFT_BY_ID[shiftId || DEFAULT_SHIFT_ID] || SHIFT_BY_ID[DEFAULT_SHIFT_ID];
  return hour >= s.startHour && hour <= s.endHour;
}

// Coverage needs keyed by roleId -> hour -> integer. Used as the starting
// point when the remote bin has no needs stored; after that, edits flow
// through the shared state editor on Settings → Roles.
const DEFAULT_NEEDS = {
  chat:  { 9: 2, 10: 3, 11: 3, 12: 3, 13: 3, 14: 3, 15: 3, 16: 3 },
  phone: { 9: 1, 10: 2, 11: 2, 12: 2, 13: 2, 14: 2, 15: 2, 16: 1 },
  email: { 8: 5, 9: 2, 10: 1, 11: 1, 12: 1, 13: 1, 14: 1, 15: 1, 16: 1, 17: 1, 18: 1, 19: 1 },
};

function getNeed(needs, roleId, hour) {
  return (needs && needs[roleId] && Number.isFinite(needs[roleId][hour])) ? needs[roleId][hour] : 0;
}

// Session (who is currently logged in) stays local to each browser so that
// different users on different devices can be signed in at the same time.
// The shared users list and schedule live in the remote JSON bin below.
const LS_KEYS = {
  session: "sched.session.v1",
};

function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}
function saveJSON(key, value) { localStorage.setItem(key, JSON.stringify(value)); }

// ---------------------------------------------------------------------------
// Remote shared storage (JSONBin.io)
//
// SETUP (one-time, by whoever hosts this file):
//   1. Sign up for a free account at https://jsonbin.io
//   2. Click "Create a Bin" and paste this as the initial JSON:
//        {
//          "users": [
//            { "username": "admin", "password": "admin123",
//              "role": "admin", "displayName": "Admin", "shift": "eastern" }
//          ],
//          "schedule": {},
//          "version": 0
//        }
//   3. Copy the Bin ID (shown on the bin's page, e.g. 68fb1c2ca41ac40f3c7f12345)
//      and paste it into `binId` below.
//   4. Open "API Keys" in the left sidebar, copy your X-MASTER-KEY, and paste
//      it into `apiKey` below.
//   5. Save this HTML and share it with your team.
//
// This key is visible to anyone who views the page source. That's okay for
// a trusted internal team with no sensitive data, but don't use this key
// for other bins you care about.
// ---------------------------------------------------------------------------
const JSONBIN_CONFIG = {
  binId: "69e26d9daaba8821970dc5f1",
  apiKey: "$2a$10$MBRCYN.w2bbJEXx4GRp6CuPriliFvwiOvxkCXYviYugzNxdio9.lm",
};
const REMOTE_POLL_MS = 10000;
const JSONBIN_BASE = "https://api.jsonbin.io/v3/b";

function isJsonbinConfigured() {
  return !!(JSONBIN_CONFIG.binId && JSONBIN_CONFIG.apiKey);
}
async function fetchRemote() {
  const res = await fetch(`${JSONBIN_BASE}/${JSONBIN_CONFIG.binId}/latest`, {
    method: "GET",
    headers: { "X-Master-Key": JSONBIN_CONFIG.apiKey },
    cache: "no-store",
  });
  if (!res.ok) throw new Error(`Fetch failed: ${res.status} ${res.statusText}`);
  const data = await res.json();
  const record = data.record || {};
  return {
    users: Array.isArray(record.users) ? record.users : [],
    roles: (Array.isArray(record.roles) && record.roles.length > 0) ? record.roles : DEFAULT_ROLES,
    schedule: (record.schedule && typeof record.schedule === "object" && !Array.isArray(record.schedule)) ? record.schedule : {},
    needs: (record.needs && typeof record.needs === "object" && !Array.isArray(record.needs)) ? record.needs : DEFAULT_NEEDS,
    version: typeof record.version === "number" ? record.version : 0,
  };
}
async function putRemote(state) {
  const res = await fetch(`${JSONBIN_BASE}/${JSONBIN_CONFIG.binId}`, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      "X-Master-Key": JSONBIN_CONFIG.apiKey,
    },
    body: JSON.stringify(state),
  });
  if (!res.ok) throw new Error(`PUT failed: ${res.status} ${res.statusText}`);
  return res.json();
}

function formatHour(h) {
  const suffix = h >= 12 ? "pm" : "am";
  const disp = ((h + 11) % 12) + 1;
  return `${disp}${suffix}`;
}
function hourRangeLabel(h) { return `${formatHour(h)}–${formatHour(h + 1)}`; }

const MONTH_NAMES = [
  "January", "February", "March", "April", "May", "June",
  "July", "August", "September", "October", "November", "December",
];

function getMondayOf(date) {
  const d = new Date(date);
  const day = d.getDay(); // 0=Sun, 1=Mon, ..., 6=Sat
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0, 0, 0, 0);
  return d;
}
function addDays(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}
function toDateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function parseDateKey(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, (m || 1) - 1, d || 1);
}
function formatWeekRange(monday) {
  const friday = addDays(monday, 4);
  const mM = MONTH_NAMES[monday.getMonth()];
  const fM = MONTH_NAMES[friday.getMonth()];
  return `${mM} ${monday.getDate()} – ${fM} ${friday.getDate()}`;
}

// Schedule is now stored as { [weekKey]: { [dayId]: { [hour]: assignments } } }.
// Older versions saved directly as { [dayId]: { [hour]: assignments } }.
// This migration moves the old shape into the current week.
const DAY_ID_SET = new Set(DAYS.map(d => d.id));
function migrateScheduleShape(raw) {
  if (!raw || typeof raw !== "object") return {};
  const keys = Object.keys(raw);
  if (keys.length === 0) return raw;
  const looksOld = keys.some(k => DAY_ID_SET.has(k));
  if (!looksOld) return raw;
  const key = toDateKey(getMondayOf(new Date()));
  return { [key]: raw };
}

// ---------------------------------------------------------------------------
// Shared state via React Context. One SharedStateProvider at the top of the
// tree is responsible for:
//   - Fetching { users, schedule, version } from the JSON bin on mount
//   - Polling every REMOTE_POLL_MS and applying changes with a higher version
//   - Accepting writes (setUsers / setSchedule) and PUTting the full state
//
// Concurrency model: last write wins. Each write bumps `version`. Polls that
// return an older or equal version are ignored, so a PUT in flight can't be
// clobbered by a poll that happens to return stale data.
// ---------------------------------------------------------------------------
const SharedStateContext = React.createContext(null);

function SharedStateProvider({ children }) {
  // Combine users + roles + schedule in one useState so functional updates
  // always see the latest values for ALL of them, even if multiple setters
  // are called in the same event handler.
  const [appState, setAppState] = useState({ users: [], roles: DEFAULT_ROLES, schedule: {}, needs: DEFAULT_NEEDS });
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [writing, setWriting] = useState(false);
  const [lastSync, setLastSync] = useState(null);

  const versionRef = React.useRef(0);
  const writeQueueRef = React.useRef(Promise.resolve());
  const inFlightWritesRef = React.useRef(0);

  // Initial fetch.
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const remote = await fetchRemote();
        if (cancelled) return;
        versionRef.current = remote.version;
        setAppState({
          users: remote.users,
          roles: remote.roles,
          schedule: migrateScheduleShape(remote.schedule),
          needs: remote.needs,
        });
        setLastSync(Date.now());
        setError(null);
      } catch (e) {
        if (!cancelled) setError(e.message || "Failed to load shared data.");
      } finally {
        if (!cancelled) setLoading(false);
      }
    })();
    return () => { cancelled = true; };
  }, []);

  // Poll for changes from other browsers.
  useEffect(() => {
    const id = setInterval(async () => {
      if (inFlightWritesRef.current > 0) return; // don't clobber in-flight writes
      try {
        const remote = await fetchRemote();
        setLastSync(Date.now());
        if (remote.version > versionRef.current) {
          versionRef.current = remote.version;
          setAppState({
            users: remote.users,
            roles: remote.roles,
            schedule: migrateScheduleShape(remote.schedule),
            needs: remote.needs,
          });
        }
        setError(null);
      } catch (e) {
        setError(e.message || "Sync error");
      }
    }, REMOTE_POLL_MS);
    return () => clearInterval(id);
  }, []);

  // Queue writes so rapid consecutive changes PUT in order rather than racing.
  function enqueueWrite(nextState) {
    inFlightWritesRef.current += 1;
    setWriting(true);
    const newVersion = versionRef.current + 1;
    versionRef.current = newVersion;
    const payload = {
      users: nextState.users,
      roles: nextState.roles,
      schedule: nextState.schedule,
      needs: nextState.needs,
      version: newVersion,
    };
    writeQueueRef.current = writeQueueRef.current.then(async () => {
      try {
        await putRemote(payload);
        setLastSync(Date.now());
        setError(null);
      } catch (e) {
        setError(e.message || "Save failed — your change may not have reached the server.");
      } finally {
        inFlightWritesRef.current -= 1;
        if (inFlightWritesRef.current === 0) setWriting(false);
      }
    });
    return writeQueueRef.current;
  }

  function setUsers(nextOrFn) {
    setAppState(prev => {
      const nextUsers = typeof nextOrFn === "function" ? nextOrFn(prev.users) : nextOrFn;
      const next = { ...prev, users: nextUsers };
      enqueueWrite(next);
      return next;
    });
  }
  function setSchedule(nextOrFn) {
    setAppState(prev => {
      const nextSchedule = typeof nextOrFn === "function" ? nextOrFn(prev.schedule) : nextOrFn;
      const next = { ...prev, schedule: nextSchedule };
      enqueueWrite(next);
      return next;
    });
  }
  function setRoles(nextOrFn) {
    setAppState(prev => {
      const nextRoles = typeof nextOrFn === "function" ? nextOrFn(prev.roles) : nextOrFn;
      const next = { ...prev, roles: nextRoles };
      enqueueWrite(next);
      return next;
    });
  }
  function setNeeds(nextOrFn) {
    setAppState(prev => {
      const nextNeeds = typeof nextOrFn === "function" ? nextOrFn(prev.needs) : nextOrFn;
      const next = { ...prev, needs: nextNeeds };
      enqueueWrite(next);
      return next;
    });
  }
  // Atomic update of roles + schedule together (used when deleting a role and
  // stripping orphan assignments in one PUT).
  function setRolesAndSchedule(nextRolesOrFn, nextScheduleOrFn) {
    setAppState(prev => {
      const nextRoles = typeof nextRolesOrFn === "function" ? nextRolesOrFn(prev.roles) : nextRolesOrFn;
      const nextSchedule = typeof nextScheduleOrFn === "function" ? nextScheduleOrFn(prev.schedule) : nextScheduleOrFn;
      const next = { ...prev, roles: nextRoles, schedule: nextSchedule };
      enqueueWrite(next);
      return next;
    });
  }

  async function refreshNow() {
    try {
      const remote = await fetchRemote();
      versionRef.current = Math.max(versionRef.current, remote.version);
      setAppState({
        users: remote.users,
        roles: remote.roles,
        schedule: migrateScheduleShape(remote.schedule),
        needs: remote.needs,
      });
      setLastSync(Date.now());
      setError(null);
    } catch (e) {
      setError(e.message || "Sync error");
    }
  }

  // Memoize decorated roles (with class strings) so identity is stable unless
  // the underlying roles array actually changes.
  const rolesDecorated = useMemo(() => appState.roles.map(decorateRole), [appState.roles]);
  const rolesById = useMemo(() => Object.fromEntries(rolesDecorated.map(r => [r.id, r])), [rolesDecorated]);
  const coverageRoles = useMemo(() => rolesDecorated.filter(r => r.isCoverage), [rolesDecorated]);

  const value = {
    users: appState.users,
    schedule: appState.schedule,
    roles: rolesDecorated,
    rolesRaw: appState.roles,  // minimal-shape roles for writing back
    rolesById,
    coverageRoles,
    needs: appState.needs,
    setUsers,
    setSchedule,
    setRoles,
    setNeeds,
    setRolesAndSchedule,
    loading,
    error,
    writing,
    lastSync,
    refreshNow,
  };
  return <SharedStateContext.Provider value={value}>{children}</SharedStateContext.Provider>;
}

function useShared() {
  const ctx = React.useContext(SharedStateContext);
  if (!ctx) throw new Error("useShared must be used inside SharedStateProvider");
  return ctx;
}

function getCellAssignments(schedule, dayId, hour) {
  return (schedule && schedule[dayId] && schedule[dayId][hour]) ? schedule[dayId][hour] : [];
}
function setCellAssignments(schedule, dayId, hour, assignments) {
  const next = { ...schedule };
  next[dayId] = { ...(next[dayId] || {}) };
  if (assignments.length === 0) delete next[dayId][hour];
  else next[dayId][hour] = assignments;
  if (Object.keys(next[dayId]).length === 0) delete next[dayId];
  return next;
}

function LoginView({ onLogin }) {
  const { users } = useShared();
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");

  function submit(e) {
    e.preventDefault();
    const u = users.find(x =>
      x.username.toLowerCase() === username.trim().toLowerCase() &&
      x.password === password
    );
    if (!u) { setError("Invalid username or password."); return; }
    const session = { username: u.username, role: u.role };
    saveJSON(LS_KEYS.session, session);
    onLogin(session);
  }

  return (
    <div className="min-h-screen bg-slate-50 flex items-center justify-center p-6">
      <form onSubmit={submit} className="bg-white shadow-md rounded-xl p-8 w-full max-w-sm border border-slate-200">
        <h1 className="text-2xl font-semibold text-slate-800 mb-1">Team Scheduler</h1>
        <p className="text-sm text-slate-500 mb-6">Sign in to continue</p>
        <label className="block text-sm font-medium text-slate-700 mb-1">Username</label>
        <input autoFocus value={username} onChange={e => setUsername(e.target.value)}
          className="w-full border border-slate-300 rounded-md px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-400" />
        <label className="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input type="password" value={password} onChange={e => setPassword(e.target.value)}
          className="w-full border border-slate-300 rounded-md px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-400" />
        {error && <div className="text-sm text-red-600 mb-3">{error}</div>}
        <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-md">
          Sign in
        </button>
        <div className="mt-6 text-xs text-slate-500 leading-relaxed">
          Default admin: <span className="font-mono">admin</span> / <span className="font-mono">admin123</span>.
          Change the password and add employees once logged in.
        </div>
      </form>
    </div>
  );
}

function ScheduleGrid({ schedule, setSchedule, employees }) {
  const [editing, setEditing] = useState(null); // { dayId, hour, role }
  return (
    <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
      <div className="grid" style={{ gridTemplateColumns: "90px repeat(5, minmax(0, 1fr))" }}>
        <div className="bg-slate-100 border-b border-slate-200 p-2 text-xs font-semibold text-slate-500 uppercase tracking-wide">Time (ET)</div>
        {DAYS.map(d => (
          <div key={d.id} className="bg-slate-100 border-b border-l border-slate-200 p-2 text-sm font-semibold text-slate-700">{d.label}</div>
        ))}
        {HOURS.map(h => (
          <React.Fragment key={h}>
            <div className="border-b border-slate-200 p-2 text-xs text-slate-500 bg-slate-50 flex items-start">{hourRangeLabel(h)}</div>
            {DAYS.map(d => (
              <ScheduleCell key={`${d.id}-${h}`} dayId={d.id} hour={h}
                assignments={getCellAssignments(schedule, d.id, h)}
                onEditRole={(role) => setEditing({ dayId: d.id, hour: h, role })} />
            ))}
          </React.Fragment>
        ))}
      </div>
      {editing && (
        <RoleAssignModal
          dayId={editing.dayId}
          hour={editing.hour}
          role={editing.role}
          schedule={schedule}
          employees={employees}
          onClose={() => setEditing(null)}
          onSave={(assignments) => {
            setSchedule(setCellAssignments(schedule, editing.dayId, editing.hour, assignments));
            setEditing(null);
          }}
        />
      )}
    </div>
  );
}

function DailyScheduleView({ schedule, setSchedule, employees }) {
  const { roles, rolesById, coverageRoles, needs } = useShared();
  const [dayId, setDayId] = useState("mon");
  const [editing, setEditing] = useState(null); // { hour, role } for needs-pill modal
  const [copyOpen, setCopyOpen] = useState(false);
  const [copyTargets, setCopyTargets] = useState([]); // array of target day IDs
  const [copyNotice, setCopyNotice] = useState(""); // short-lived success message
  const [coverageCollapsed, setCoverageCollapsed] = useState(false);

  function toggleCopyTarget(id) {
    setCopyTargets(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
  }

  // Copy the current day's entire assignments to each selected target day,
  // overwriting what's there. A single setSchedule call keeps the write atomic.
  function applyCopy() {
    const sourceDay = schedule[dayId];
    setSchedule(prev => {
      const next = { ...prev };
      copyTargets.forEach(tid => {
        if (!sourceDay || Object.keys(sourceDay).length === 0) {
          delete next[tid];
        } else {
          // Deep-copy each hour's assignment list so the two days don't alias.
          const clonedDay = {};
          for (const [h, assigns] of Object.entries(sourceDay)) {
            clonedDay[h] = assigns.map(a => ({ ...a }));
          }
          next[tid] = clonedDay;
        }
      });
      return next;
    });
    const dayLabels = copyTargets.map(tid => (DAYS.find(d => d.id === tid) || {}).label).filter(Boolean).join(", ");
    setCopyNotice(`Copied ${dayLabel || "today"} to ${dayLabels}.`);
    setCopyOpen(false);
    setCopyTargets([]);
    setTimeout(() => setCopyNotice(""), 3500);
  }

  const dayLabel = (DAYS.find(d => d.id === dayId) || {}).label;

  function setRoleForUser(username, hour, newRole) {
    const existing = getCellAssignments(schedule, dayId, hour);
    const withoutUser = existing.filter(a => a.username !== username);
    const next = newRole ? [...withoutUser, { username, role: newRole }] : withoutUser;
    setSchedule(setCellAssignments(schedule, dayId, hour, next));
  }

  // Build an array of runs for a given employee across the day's HOURS.
  // Consecutive hours with the same truthy role merge into a single "assigned"
  // run; consecutive off-shift hours merge into a single "off" run; empty
  // in-shift hours stay as their own single-hour run so they're clickable.
  function getRunsForEmployee(username, shiftId) {
    const runs = [];
    let current = null;
    HOURS.forEach(h => {
      const inShift = isHourInShift(shiftId, h);
      if (!inShift) {
        if (current && current.type === "off" && current.endHour === h - 1) {
          current.endHour = h;
        } else {
          current = { type: "off", startHour: h, endHour: h, role: "" };
          runs.push(current);
        }
        return;
      }
      const assigns = getCellAssignments(schedule, dayId, h);
      const mine = assigns.find(a => a.username === username);
      const role = mine ? mine.role : "";
      if (role && current && current.type === "assigned" && current.role === role && current.endHour === h - 1) {
        current.endHour = h;
      } else {
        current = { type: "assigned", startHour: h, endHour: h, role };
        runs.push(current);
        if (!role) current = null; // don't merge empty cells
      }
    });
    return runs;
  }

  // Apply a role change to every hour in a run's range.
  function setRoleForRun(username, run, newRole) {
    let nextSched = schedule;
    for (let h = run.startHour; h <= run.endHour; h++) {
      const existing = getCellAssignments(nextSched, dayId, h);
      const withoutUser = existing.filter(a => a.username !== username);
      const hourNext = newRole ? [...withoutUser, { username, role: newRole }] : withoutUser;
      nextSched = setCellAssignments(nextSched, dayId, h, hourNext);
    }
    setSchedule(nextSched);
  }

  const otherDays = DAYS.filter(d => d.id !== dayId);
  const sourceHasData = schedule[dayId] && Object.keys(schedule[dayId]).length > 0;

  return (
    <div>
      {/* Day picker + Copy Schedule */}
      <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
        <div className="flex flex-wrap gap-1">
          {DAYS.map(d => (
            <button
              key={d.id}
              onClick={() => setDayId(d.id)}
              className={`px-3 py-1.5 rounded-md text-sm font-medium transition ${
                dayId === d.id
                  ? "bg-blue-600 text-white"
                  : "bg-white border border-slate-300 text-slate-700 hover:bg-slate-50"
              }`}
            >
              {d.label}
            </button>
          ))}
        </div>
        <div className="relative">
          <button
            onClick={() => { setCopyOpen(o => !o); setCopyTargets([]); }}
            className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-sm font-medium bg-white border border-slate-300 text-slate-700 hover:bg-slate-50"
          >
            <svg viewBox="0 0 20 20" fill="currentColor" className="w-4 h-4">
              <path d="M8 2a2 2 0 00-2 2v1H5a2 2 0 00-2 2v9a2 2 0 002 2h8a2 2 0 002-2v-1h1a2 2 0 002-2V5a2 2 0 00-2-2H8zm0 2h8v9h-1V7a2 2 0 00-2-2H8V4zM5 7h8v9H5V7z" />
            </svg>
            Copy Schedule
          </button>
          {copyOpen && (
            <div className="absolute right-0 top-full mt-2 z-30 w-72 bg-white border border-slate-200 rounded-xl shadow-lg p-3">
              <div className="text-xs font-semibold uppercase tracking-wide text-slate-500 mb-2">
                Copy {dayLabel}'s schedule to:
              </div>
              {!sourceHasData && (
                <div className="mb-2 text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded px-2 py-1.5">
                  {dayLabel} is empty — copying will clear the selected days.
                </div>
              )}
              <div className="flex flex-col gap-1 mb-3">
                {otherDays.map(d => {
                  const checked = copyTargets.includes(d.id);
                  return (
                    <label key={d.id} className="flex items-center gap-2 px-2 py-1 rounded hover:bg-slate-50 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={checked}
                        onChange={() => toggleCopyTarget(d.id)}
                        className="accent-blue-600"
                      />
                      <span className="text-sm text-slate-700">{d.label}</span>
                    </label>
                  );
                })}
              </div>
              <div className="flex items-center justify-between gap-2">
                <button
                  onClick={() => setCopyTargets(copyTargets.length === otherDays.length ? [] : otherDays.map(d => d.id))}
                  className="text-xs text-blue-600 hover:text-blue-800"
                >
                  {copyTargets.length === otherDays.length ? "Clear all" : "Select all"}
                </button>
                <div className="flex gap-2">
                  <button
                    onClick={() => { setCopyOpen(false); setCopyTargets([]); }}
                    className="px-3 py-1 text-sm rounded-md border border-slate-300 text-slate-700 hover:bg-slate-50"
                  >Cancel</button>
                  <button
                    disabled={copyTargets.length === 0}
                    onClick={applyCopy}
                    className="px-3 py-1 text-sm rounded-md bg-blue-600 text-white font-medium hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed"
                  >Copy</button>
                </div>
              </div>
            </div>
          )}
        </div>
      </div>
      {copyNotice && (
        <div className="mb-3 text-sm text-green-800 bg-green-50 border border-green-200 rounded-md px-3 py-1.5">
          {copyNotice}
        </div>
      )}

      {employees.length === 0 ? (
        <div className="bg-amber-50 border border-amber-200 text-amber-800 rounded-xl p-4 text-sm">
          Add users on the Employees tab first, then come back here to schedule them by day.
        </div>
      ) : (
        <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-x-auto">
          <table className="w-full text-sm border-collapse">
            <thead>
              {/* Hour label row */}
              <tr>
                <th className="bg-slate-100 border-b border-slate-200 p-2 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide sticky left-0 z-20">
                  {dayLabel}
                </th>
                {HOURS.map(h => (
                  <th key={h} className="bg-slate-100 border-b border-l border-slate-200 p-2 text-center text-xs font-semibold text-slate-700 whitespace-nowrap">
                    {hourRangeLabel(h)}
                  </th>
                ))}
              </tr>
              {/* Coverage needs row (collapsable) */}
              <tr>
                <th
                  colSpan={coverageCollapsed ? HOURS.length + 1 : 1}
                  className="bg-slate-50 border-b border-slate-200 p-2 text-left text-[11px] font-semibold text-slate-500 uppercase tracking-wide sticky left-0 z-20"
                >
                  <button
                    type="button"
                    onClick={() => setCoverageCollapsed(v => !v)}
                    className="inline-flex items-center gap-1 hover:text-slate-700"
                    title={coverageCollapsed ? "Expand coverage" : "Collapse coverage"}
                  >
                    <span className={`inline-block transition-transform ${coverageCollapsed ? "" : "rotate-90"}`}>▸</span>
                    <span>Coverage</span>
                    {coverageCollapsed && (
                      <span className="ml-2 normal-case tracking-normal text-slate-400 text-[11px] font-normal">(click to expand)</span>
                    )}
                  </button>
                </th>
                {!coverageCollapsed && HOURS.map(h => {
                  const assigns = getCellAssignments(schedule, dayId, h);
                  const counts = {};
                  assigns.forEach(a => { counts[a.role] = (counts[a.role] || 0) + 1; });
                  return (
                    <td key={h} className="bg-slate-50 border-b border-l border-slate-200 p-1 align-top">
                      <div className="flex flex-col gap-1">
                        {coverageRoles.map(r => {
                          const need = getNeed(needs, r.id, h);
                          const have = counts[r.id] || 0;
                          const filled = (need > 0 && have >= need) || (need === 0 && have > 0);
                          let btnClass;
                          if (filled) btnClass = r.solid;
                          else if (need > 0 || have > 0) btnClass = r.light;
                          else btnClass = "bg-white text-slate-400 border-slate-200";
                          const countText = need > 0 ? `${have}/${need}` : `${have}`;
                          return (
                            <button
                              key={r.id}
                              onClick={() => setEditing({ hour: h, role: r.id })}
                              title={`${have} of ${need} ${r.label} — click to manage`}
                              className={`${btnClass} border rounded px-1.5 py-0.5 text-[10px] hover:opacity-80 transition flex items-center justify-between gap-1`}
                            >
                              <span className="font-semibold">{r.label.charAt(0)}</span>
                              <span className="tabular-nums">{countText}</span>
                            </button>
                          );
                        })}
                      </div>
                    </td>
                  );
                })}
              </tr>
            </thead>
            <tbody>
              {employees.map(emp => {
                const shiftId = getShiftOf(emp);
                const runs = getRunsForEmployee(emp.username, shiftId);
                const shiftLabel = (SHIFT_BY_ID[shiftId] || {}).label || "";
                return (
                  <tr key={emp.username} className="border-t border-slate-200">
                    <td className="p-2 bg-white border-r border-slate-200 font-medium text-slate-700 sticky left-0 z-10 whitespace-nowrap">
                      {emp.displayName || emp.username}
                      {emp.role === "admin" && (
                        <span className="ml-2 text-[10px] uppercase text-blue-700 bg-blue-50 border border-blue-200 rounded px-1 py-0.5">Admin</span>
                      )}
                      <span className="ml-2 text-[10px] uppercase text-slate-500 bg-slate-100 border border-slate-200 rounded px-1 py-0.5">{shiftLabel}</span>
                    </td>
                    {runs.map(run => {
                      const span = run.endHour - run.startHour + 1;
                      if (run.type === "off") {
                        return (
                          <td
                            key={run.startHour}
                            colSpan={span}
                            className="p-1 border-l border-slate-200 bg-slate-100 align-middle"
                            title={`Off shift — ${shiftLabel} (${formatHour(SHIFT_BY_ID[shiftId].startHour)}–${formatHour(SHIFT_BY_ID[shiftId].endHour + 1)})`}
                          >
                            <div className="text-center text-[11px] text-slate-400 italic select-none">Off</div>
                          </td>
                        );
                      }
                      const role = run.role;
                      const roleObj = role ? rolesById[role] : null;
                      const isMulti = span > 1;
                      const selectClass = roleObj
                        ? `${roleObj.solid} border font-semibold`
                        : "bg-white border-slate-200 text-slate-400";
                      const rangeTitle = roleObj
                        ? `${roleObj.label} · ${formatHour(run.startHour)}–${formatHour(run.endHour + 1)}`
                        : "";
                      return (
                        <td
                          key={run.startHour}
                          colSpan={span}
                          className="p-1 border-l border-slate-200 align-middle"
                        >
                          <div className="relative">
                            <select
                              value={role}
                              onChange={(e) => setRoleForRun(emp.username, run, e.target.value)}
                              title={rangeTitle}
                              className={`${selectClass} w-full text-xs rounded ${isMulti ? "px-2 py-1.5" : "px-1 py-1"} cursor-pointer focus:outline-none focus:ring-2 focus:ring-blue-400`}
                            >
                              <option value="">—</option>
                              {roles.map(r => (
                                <option key={r.id} value={r.id}>{r.label}</option>
                              ))}
                            </select>
                            {isMulti && roleObj && (
                              <span className="pointer-events-none absolute inset-y-0 left-2 flex items-center text-[10px] uppercase tracking-wide opacity-90">
                                {span}h
                              </span>
                            )}
                          </div>
                        </td>
                      );
                    })}
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

      {editing && (
        <RoleAssignModal
          dayId={dayId}
          hour={editing.hour}
          role={editing.role}
          schedule={schedule}
          employees={employees}
          onClose={() => setEditing(null)}
          onSave={(assignments) => {
            setSchedule(setCellAssignments(schedule, dayId, editing.hour, assignments));
            setEditing(null);
          }}
        />
      )}
    </div>
  );
}

function ScheduleCell({ dayId, hour, assignments, onEditRole }) {
  const { roles, coverageRoles, needs } = useShared();
  const assignedByRole = {};
  roles.forEach(r => { assignedByRole[r.id] = []; });
  assignments.forEach(a => {
    if (!assignedByRole[a.role]) assignedByRole[a.role] = [];
    assignedByRole[a.role].push(a.username);
  });

  return (
    <div className="border-b border-l border-slate-200 p-1.5 min-h-[72px]">
      <div className="flex flex-col gap-1">
        {coverageRoles.map(r => {
          const need = getNeed(needs, r.id, hour);
          const names = assignedByRole[r.id] || [];
          const have = names.length;

          // Style states:
          //  - filled: solid color (have >= need && need > 0), or any assignments when need == 0
          //  - partial: light color (0 < have < need)
          //  - empty-with-need: light color (need > 0, have == 0)
          //  - zero/zero: muted (need == 0 && have == 0) — still clickable
          let btnClass;
          if ((need > 0 && have >= need) || (need === 0 && have > 0)) {
            btnClass = r.solid;
          } else if (need > 0 || have > 0) {
            btnClass = r.light;
          } else {
            btnClass = "bg-slate-50 text-slate-400 border-slate-200";
          }

          const countText = need > 0 ? `${have}/${need}` : `${have}`;

          return (
            <button
              key={r.id}
              onClick={() => onEditRole(r.id)}
              title={`${have} of ${need} ${r.label} assigned — click to edit`}
              className={`${btnClass} border text-left w-full px-2 py-1 rounded text-[11px] hover:opacity-80 transition`}
            >
              <div className="flex items-center justify-between gap-1">
                <span className="font-semibold">{r.label}</span>
                <span className="tabular-nums">{countText}</span>
              </div>
              {names.length > 0 && (
                <div className="text-[10px] mt-0.5 opacity-90 truncate">
                  {names.join(", ")}
                </div>
              )}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function RoleAssignModal({ dayId, hour, role, schedule, employees, onClose, onSave }) {
  const { rolesById, needs } = useShared();
  const existing = getCellAssignments(schedule, dayId, hour);
  const currentForRole = existing.filter(a => a.role === role).map(a => a.username);
  const [selected, setSelected] = useState(() => new Set(currentForRole));

  // Map of username -> other role they're on at this hour (if any)
  const otherRole = {};
  existing.forEach(a => { if (a.role !== role) otherRole[a.username] = a.role; });

  const dayLabel = (DAYS.find(d => d.id === dayId) || {}).label;
  const roleObj = rolesById[role] || { label: role, solid: "bg-slate-600 text-white border-slate-700" };
  const need = getNeed(needs, role, hour);

  function toggle(username) {
    const next = new Set(selected);
    if (next.has(username)) next.delete(username);
    else next.add(username);
    setSelected(next);
  }

  function save() {
    const kept = existing.filter(a => a.role !== role);
    const added = Array.from(selected).map(username => ({ username, role }));
    onSave([...kept, ...added]);
  }

  const have = selected.size;
  const meetsNeed = need === 0 || have >= need;

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50" onClick={onClose}>
      <div className="bg-white rounded-xl shadow-xl w-full max-w-md p-6" onClick={e => e.stopPropagation()}>
        <div className="flex items-start justify-between mb-1">
          <h3 className="text-lg font-semibold text-slate-800">
            {dayLabel} · {hourRangeLabel(hour)}
          </h3>
          <span className={`text-xs font-semibold px-2 py-0.5 rounded border ${roleObj.solid}`}>
            {roleObj.label}
          </span>
        </div>
        <p className="text-sm text-slate-500 mb-4">
          {need > 0
            ? <span>{have}/{need} assigned {meetsNeed && <span className="text-green-700">· fully staffed</span>}</span>
            : <span>{have} assigned · no minimum for this hour</span>}
        </p>

        {employees.length === 0 ? (
          <div className="text-sm text-amber-700 bg-amber-50 border border-amber-200 rounded-md p-3 mb-4">
            No users yet. Add them on the Employees tab.
          </div>
        ) : (
          <div className="max-h-80 overflow-y-auto border border-slate-200 rounded-md mb-4">
            {employees.map(emp => {
              const busyOn = otherRole[emp.username];
              const isBusy = !!busyOn;
              const empShift = getShiftOf(emp);
              const offShift = !isHourInShift(empShift, hour);
              const isDisabled = isBusy || offShift;
              const isSelected = selected.has(emp.username);
              const busyLabel = isBusy && ((rolesById[busyOn] || {}).label || busyOn);
              const shiftLabel = (SHIFT_BY_ID[empShift] || {}).label || "";
              let note = null;
              if (isBusy) note = `Already on ${busyLabel} this hour`;
              else if (offShift) note = `Off shift (${shiftLabel})`;
              return (
                <label
                  key={emp.username}
                  className={`flex items-center gap-3 px-3 py-2 border-b last:border-b-0 border-slate-100 ${
                    isDisabled ? "opacity-60 cursor-not-allowed bg-slate-50" : "cursor-pointer hover:bg-slate-50"
                  }`}
                >
                  <input
                    type="checkbox"
                    disabled={isDisabled}
                    checked={isSelected}
                    onChange={() => !isDisabled && toggle(emp.username)}
                    className="w-4 h-4"
                  />
                  <div className="flex-1 min-w-0">
                    <div className="text-sm text-slate-800">
                      {emp.displayName || emp.username}
                      {emp.role === "admin" && (
                        <span className="ml-2 text-[10px] uppercase text-blue-700 bg-blue-50 border border-blue-200 rounded px-1 py-0.5">Admin</span>
                      )}
                      <span className="ml-2 text-[10px] uppercase text-slate-500 bg-slate-100 border border-slate-200 rounded px-1 py-0.5">{shiftLabel}</span>
                    </div>
                    {note && (
                      <div className="text-xs text-slate-500">{note}</div>
                    )}
                  </div>
                </label>
              );
            })}
          </div>
        )}

        <div className="flex justify-end gap-2">
          <button onClick={onClose} className="px-4 py-2 text-sm text-slate-600 hover:text-slate-800">Cancel</button>
          <button onClick={save}
            className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-md">Save</button>
        </div>
      </div>
    </div>
  );
}

function EmployeesTab({ users, setUsers, currentUsername }) {
  const [form, setForm] = useState({ username: "", displayName: "", password: "", role: "employee", shift: DEFAULT_SHIFT_ID });
  const [error, setError] = useState("");

  function addUser(e) {
    e.preventDefault(); setError("");
    const username = form.username.trim().toLowerCase();
    if (!username || !form.password) { setError("Username and password are required."); return; }
    if (users.some(u => u.username.toLowerCase() === username)) { setError("That username already exists."); return; }
    setUsers([...users, {
      username,
      password: form.password,
      role: form.role,
      displayName: form.displayName.trim() || username,
      shift: form.shift,
    }]);
    setForm({ username: "", displayName: "", password: "", role: "employee", shift: DEFAULT_SHIFT_ID });
  }

  function removeUser(username) {
    if (username.toLowerCase() === currentUsername.toLowerCase()) {
      alert("You can't remove your own account while signed in.");
      return;
    }
    if (!confirm(`Remove user "${username}"?`)) return;
    setUsers(users.filter(u => u.username !== username));
  }

  function resetPassword(username) {
    const pwd = prompt(`New password for ${username}:`);
    if (!pwd) return;
    setUsers(users.map(u => u.username === username ? { ...u, password: pwd } : u));
  }

  function changeRole(username, newRole) {
    if (username.toLowerCase() === currentUsername.toLowerCase() && newRole !== "admin") {
      alert("You can't demote your own account while signed in. Ask another admin to change your role.");
      return;
    }
    setUsers(users.map(u => u.username === username ? { ...u, role: newRole } : u));
  }

  function changeShift(username, newShift) {
    setUsers(users.map(u => u.username === username ? { ...u, shift: newShift } : u));
  }

  const adminCount = users.filter(u => u.role === "admin").length;

  return (
    <div className="space-y-6">
      <div className="bg-white border border-slate-200 rounded-xl p-6">
        <h3 className="text-md font-semibold text-slate-800 mb-4">Add user</h3>
        <form onSubmit={addUser} className="grid grid-cols-1 sm:grid-cols-6 gap-3">
          <input placeholder="Username" value={form.username} onChange={e => setForm({ ...form, username: e.target.value })}
            className="border border-slate-300 rounded-md px-3 py-2 text-sm" />
          <input placeholder="Display name (optional)" value={form.displayName} onChange={e => setForm({ ...form, displayName: e.target.value })}
            className="border border-slate-300 rounded-md px-3 py-2 text-sm" />
          <input placeholder="Password" type="text" value={form.password} onChange={e => setForm({ ...form, password: e.target.value })}
            className="border border-slate-300 rounded-md px-3 py-2 text-sm" />
          <select value={form.role} onChange={e => setForm({ ...form, role: e.target.value })}
            className="border border-slate-300 rounded-md px-3 py-2 text-sm bg-white">
            <option value="employee">Employee</option>
            <option value="admin">Admin</option>
          </select>
          <select value={form.shift} onChange={e => setForm({ ...form, shift: e.target.value })}
            className="border border-slate-300 rounded-md px-3 py-2 text-sm bg-white">
            {SHIFTS.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
          </select>
          <button className="bg-blue-600 hover:bg-blue-700 text-white rounded-md text-sm font-medium px-4">Add</button>
        </form>

// Count how many assignments across the entire schedule reference a role ID.
function countRoleUsage(schedule, roleId) {
  let n = 0;
  for (const week of Object.values(schedule || {})) {
    for (const day of Object.values(week || {})) {
      for (const hourAssigns of Object.values(day || {})) {
        for (const a of (hourAssigns || [])) {
          if (a.role === roleId) n += 1;
        }
      }
    }
  }
  return n;
}

// Return a new schedule with all assignments for roleId removed, pruning any
// empty hour/day/week containers so the shape stays tidy.
function scheduleWithoutRole(schedule, roleId) {
  const out = {};
  for (const [weekKey, week] of Object.entries(schedule || {})) {
    const nextWeek = {};
    for (const [dayId, day] of Object.entries(week || {})) {
      const nextDay = {};
      for (const [hour, hourAssigns] of Object.entries(day || {})) {
        const kept = (hourAssigns || []).filter(a => a.role !== roleId);
        if (kept.length > 0) nextDay[hour] = kept;
      }
      if (Object.keys(nextDay).length > 0) nextWeek[dayId] = nextDay;
    }
    if (Object.keys(nextWeek).length > 0) out[weekKey] = nextWeek;
  }
  return out;
}

function RolesTab() {
  // Read decorated `roles` for rendering and raw `rolesRaw` (with palette-name
  // colors, not class strings) for writing back via setRoles.
  const { roles, rolesRaw, setRoles, schedule, setRolesAndSchedule } = useShared();
  const [newLabel, setNewLabel] = useState("");
  const [newColor, setNewColor] = useState("indigo");
  const [newIsCoverage, setNewIsCoverage] = useState(false);
  const [error, setError] = useState("");

  function addRole(e) {
    e.preventDefault();
    setError("");
    const label = newLabel.trim();
    if (!label) { setError("Label is required."); return; }
    const existingIds = rolesRaw.map(r => r.id);
    const id = slugifyRoleId(label, existingIds);
    const existingLabels = rolesRaw.map(r => r.label.toLowerCase());
    if (existingLabels.includes(label.toLowerCase())) {
      setError("A role with that label already exists.");
      return;
    }
    setRoles([...rolesRaw, { id, label, color: newColor, isCoverage: newIsCoverage }]);
    setNewLabel("");
    setNewColor("indigo");
    setNewIsCoverage(false);
  }

  function updateRole(id, patch) {
    setRoles(rolesRaw.map(r => r.id === id ? { ...r, ...patch } : r));
  }

  function removeRole(id) {
    const role = rolesRaw.find(r => r.id === id);
    if (!role) return;
    const inUse = countRoleUsage(schedule, id);
    const msg = inUse > 0
      ? `"${role.label}" is used in ${inUse} scheduled assignment${inUse === 1 ? "" : "s"}. Delete the role and remove those assignments?`
      : `Delete the role "${role.label}"?`;
    if (!confirm(msg)) return;
    if (inUse > 0) {
      setRolesAndSchedule(
        rolesRaw.filter(r => r.id !== id),
        scheduleWithoutRole(schedule, id)
      );
    } else {
      setRoles(rolesRaw.filter(r => r.id !== id));
    }
  }

  return (
    <div className="space-y-6">
      <div className="bg-white border border-slate-200 rounded-xl p-6">
        <h3 className="text-md font-semibold text-slate-800 mb-4">Add role</h3>

              <label className="block text-xs font-medium text-slate-600 mb-1">Label</label>
              <input
                placeholder="e.g. Training"
                value={newLabel}
                onChange={e => setNewLabel(e.target.value)}
                className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm"
              />
            </div>
            <div>
              <label className="block text-xs font-medium text-slate-600 mb-1">Color</label>
              <div className="py-2">
                <ColorPicker value={newColor} onChange={setNewColor} />
              </div>
            </div>
            <div>
              <label className="block text-xs font-medium text-slate-600 mb-1">Coverage role</label>
              <label className="inline-flex items-center gap-2 text-sm text-slate-700 py-2">
                <input
                  type="checkbox"
                  checked={newIsCoverage}
                  onChange={e => setNewIsCoverage(e.target.checked)}
                  className="w-4 h-4"
                />
                <span>Track on hourly coverage grid</span>
              </label>
            </div>
            <div className="self-end">
              <button className="bg-blue-600 hover:bg-blue-700 text-white rounded-md text-sm font-medium px-4 py-2">Add role</button>
            </div>
          </div>
          {error && <div className="text-sm text-red-600">{error}</div>}
          <p className="text-xs text-slate-500">
            Coverage roles (like Chat, Phone, Email) show as pills on the schedule grid and in the per-hour coverage row. Non-coverage roles (like Lunch, Meeting) only show when assigned to an employee.
          </p>
        </form>
      </div>

      <div className="bg-white border border-slate-200 rounded-xl overflow-hidden">
        <div className="p-4 border-b border-slate-200 flex items-center justify-between">
          <h3 className="text-md font-semibold text-slate-800">Roles ({roles.length})</h3>
        </div>
        {roles.length === 0 ? (
          <div className="p-6 text-sm text-slate-500 italic">No roles yet. Add one above.</div>
        ) : (
          <table className="w-full text-sm">

                <th className="px-4 py-2">Coverage</th>

              </tr>

                const usage = countRoleUsage(schedule, r.id);
                return (

// Editable table of coverage needs keyed by (coverage role × hour). Writes
// flow through setNeeds, which persists to the shared JSON bin.
function CoverageNeedsEditor() {
  const { coverageRoles, needs, setNeeds } = useShared();

  function updateNeed(roleId, hour, rawValue) {
    const parsed = Math.max(0, Math.floor(Number(rawValue) || 0));
    setNeeds(prev => {
      const prevRole = (prev && prev[roleId]) || {};
      const nextRole = { ...prevRole };
      if (parsed === 0) delete nextRole[hour];
      else nextRole[hour] = parsed;
      const next = { ...(prev || {}) };
      if (Object.keys(nextRole).length === 0) delete next[roleId];
      else next[roleId] = nextRole;
      return next;
    });
  }

  return (
    <div className="mt-6">
      <div className="mb-2 flex items-end justify-between flex-wrap gap-2">
        <div>
          <h3 className="text-base font-semibold text-slate-800">Coverage needs</h3>
          <p className="text-sm text-slate-500">How many people each coverage role needs at each hour. Zero means optional.</p>
        </div>
      </div>
      {coverageRoles.length === 0 ? (
        <div className="bg-amber-50 border border-amber-200 text-amber-800 rounded-xl p-4 text-sm">
          No coverage roles yet. Mark a role as "Needs coverage" above to edit its targets here.
        </div>
      ) : (
        <div className="bg-white rounded-xl border border-slate-200 overflow-x-auto">
          <table className="w-full text-sm border-collapse">
            <thead>
              <tr>
                <th className="bg-slate-50 border-b border-slate-200 p-2 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide sticky left-0 z-10 w-[140px]">Role</th>
                {HOURS.map(h => (
                  <th key={h} className="bg-slate-50 border-b border-l border-slate-200 p-2 text-center text-[11px] font-semibold text-slate-600 whitespace-nowrap">
                    {hourRangeLabel(h)}
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {coverageRoles.map(r => (
                <tr key={r.id} className="border-t border-slate-200">
                  <td className="p-2 bg-white sticky left-0 z-10 border-r border-slate-200 whitespace-nowrap">
                    <span className={`inline-flex items-center px-2 py-0.5 rounded border text-xs font-semibold ${r.solid}`}>
                      {r.label}
                    </span>
                  </td>
                  {HOURS.map(h => {
                    const val = getNeed(needs, r.id, h);
                    return (
                      <td key={h} className="p-1 border-l border-slate-200 text-center">
                        <input
                          type="number"
                          min="0"
                          value={val}
                          onChange={e => updateNeed(r.id, h, e.target.value)}
                          className={`w-12 text-center text-sm rounded border px-1 py-1 focus:outline-none focus:ring-2 focus:ring-blue-400 ${val > 0 ? "border-slate-300 bg-white text-slate-800" : "border-slate-200 bg-slate-50 text-slate-400"}`}
                        />
                      </td>
                    );
                  })}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function ReportsTab() {
  const { users, roles, schedule: fullSchedule } = useShared();
  const [weekStart, setWeekStart] = useState(() => getMondayOf(new Date()));
  const weekKey = toDateKey(weekStart);
  const weekSchedule = fullSchedule[weekKey] || {};

  // Count hours per (username, roleId) for the selected week.
  // Also collect any orphan role IDs that appear in assignments but don't
  // match an existing role so we can show them in a trailing "Other" column.
  const { hoursByUser, totalsByRole, grandTotal, orphanRoleIds } = useMemo(() => {
    const hoursByUser = {};
    const totalsByRole = {};
    const knownIds = new Set(roles.map(r => r.id));
    const orphans = new Set();
    let grand = 0;
    DAYS.forEach(d => {
      HOURS.forEach(h => {
        const assigns = (weekSchedule[d.id] && weekSchedule[d.id][h]) || [];
        assigns.forEach(a => {
          if (!hoursByUser[a.username]) hoursByUser[a.username] = {};
          hoursByUser[a.username][a.role] = (hoursByUser[a.username][a.role] || 0) + 1;
          totalsByRole[a.role] = (totalsByRole[a.role] || 0) + 1;
          grand += 1;
          if (!knownIds.has(a.role)) orphans.add(a.role);
        });
      });
    });
    return {
      hoursByUser,
      totalsByRole,
      grandTotal: grand,
      orphanRoleIds: Array.from(orphans),
    };
  }, [weekSchedule, roles]);

  const roleColumns = [...roles, ...orphanRoleIds.map(id => ({
    id, label: id, color: "bg-slate-100 text-slate-500 border-slate-200",
    solid: "bg-slate-400 text-white border-slate-500", isOrphan: true,
  }))];

  function userTotal(username) {
    const row = hoursByUser[username] || {};
    return Object.values(row).reduce((a, b) => a + b, 0);
  }

  return (
    <div>
      <div className="mb-4 flex items-end justify-between gap-3 flex-wrap">
        <div>
          <h2 className="text-lg font-semibold text-slate-800">Hours by employee and role</h2>
          <p className="text-sm text-slate-500">
            One point = one assigned hour. Totals roll up all assignments (coverage and non-coverage) for the selected week.
          </p>
        </div>
        <WeekSelector weekStart={weekStart} onChange={setWeekStart} />
      </div>

      {users.length === 0 ? (
        <div className="bg-amber-50 border border-amber-200 text-amber-800 rounded-xl p-4 text-sm">
          Add users on the Employees tab first, then come back here to see their hours.
        </div>
      ) : (
        <div className="bg-white border border-slate-200 rounded-xl overflow-x-auto">
          <table className="w-full text-sm">
            <thead className="bg-slate-50 text-slate-600 text-xs uppercase">
              <tr>
                <th className="px-4 py-2 text-left sticky left-0 bg-slate-50 z-10">Employee</th>
                {roleColumns.map(r => (
                  <th key={r.id} className="px-3 py-2 text-center whitespace-nowrap">
                    <span className={`inline-flex items-center px-2 py-0.5 rounded border text-[11px] font-semibold ${r.solid}`}>
                      {r.label}{r.isOrphan ? " (deleted)" : ""}
                    </span>
                  </th>
                ))}
                <th className="px-4 py-2 text-center font-semibold">Total</th>
              </tr>
            </thead>
            <tbody>
              {users.map(u => {
                const row = hoursByUser[u.username] || {};
                const total = userTotal(u.username);
                const shiftLabel = (SHIFT_BY_ID[getShiftOf(u)] || {}).label || "";
                return (
                  <tr key={u.username} className="border-t border-slate-100">
                    <td className="px-4 py-2 sticky left-0 bg-white whitespace-nowrap">
                      <span className="text-slate-800 font-medium">{u.displayName || u.username}</span>
                      {u.role === "admin" && (
                        <span className="ml-2 text-[10px] uppercase text-blue-700 bg-blue-50 border border-blue-200 rounded px-1 py-0.5">Admin</span>
                      )}
                      <span className="ml-2 text-[10px] uppercase text-slate-500 bg-slate-100 border border-slate-200 rounded px-1 py-0.5">{shiftLabel}</span>
                    </td>
                    {roleColumns.map(r => {
                      const v = row[r.id] || 0;
                      return (
                        <td
                          key={r.id}
                          className={`px-3 py-2 text-center tabular-nums ${v > 0 ? "text-slate-800" : "text-slate-300"}`}
                        >
                          {v}
                        </td>
                      );
                    })}
                    <td className={`px-4 py-2 text-center font-semibold tabular-nums ${total > 0 ? "text-slate-900" : "text-slate-300"}`}>
                      {total}
                    </td>
                  </tr>
                );
              })}
            </tbody>
            <tfoot>
              <tr className="bg-slate-50 border-t border-slate-200">
                <td className="px-4 py-2 text-slate-600 text-xs uppercase tracking-wide sticky left-0 bg-slate-50">Total</td>
                {roleColumns.map(r => (
                  <td key={r.id} className="px-3 py-2 text-center font-semibold tabular-nums text-slate-700">
                    {totalsByRole[r.id] || 0}
                  </td>
                ))}
                <td className="px-4 py-2 text-center font-bold tabular-nums text-slate-900">{grandTotal}</td>
              </tr>
            </tfoot>
          </table>
        </div>
      )}
    </div>
  );
}

  const [previewUsername, setPreviewUsername] = useState("");

  const [weekStart, setWeekStart] = useState(() => getMondayOf(new Date()));
  const weekKey = toDateKey(weekStart);
  const weekSchedule = fullSchedule[weekKey] || {};

  function setWeekSchedule(nextOrFn) {
    setFullSchedule(prev => {
      const current = prev[weekKey] || {};
      const next = typeof nextOrFn === "function" ? nextOrFn(current) : nextOrFn;
      const copy = { ...prev };
      if (!next || Object.keys(next).length === 0) delete copy[weekKey];
      else copy[weekKey] = next;
      return copy;
    });
  }

  // Default the preview selector to the first employee once available
  useEffect(() => {
    if (!previewUsername && employees.length > 0) {
      setPreviewUsername(employees[0].username);
    }
  }, [employees, previewUsername]);

  return (
    <div className="min-h-screen bg-slate-50">
      <TopBar session={session} onLogout={onLogout} title="RenewedVision Support" />
      <div className="max-w-7xl mx-auto px-6 py-6">
        <div className="flex items-center justify-between gap-3 mb-4 border-b border-slate-200 flex-wrap">
          <div className="flex gap-1">
            <TabButton active={tab === "schedule"} onClick={() => setTab("schedule")}>Schedule</TabButton>
            <TabButton active={tab === "viewer"} onClick={() => setTab("viewer")}>Schedule Viewer</TabButton>
            <TabButton active={tab === "settings"} onClick={() => setTab("settings")}>Settings</TabButton>
          </div>
          {tab !== "settings" && (
            <div className="pb-2">
              <WeekSelector weekStart={weekStart} onChange={setWeekStart} />
            </div>
          )}
        </div>
        {tab === "schedule" && (
          <div>
            <div className="mb-3 flex items-center justify-between gap-3 flex-wrap">
              <div className="inline-flex rounded-md border border-slate-300 bg-white overflow-hidden">
                <button
                  onClick={() => setScheduleView("week")}
                  className={`px-3 py-1.5 text-sm font-medium ${scheduleView === "week" ? "bg-blue-600 text-white" : "text-slate-700 hover:bg-slate-50"}`}
                >Week view</button>
                <button
                  onClick={() => setScheduleView("day")}
                  className={`px-3 py-1.5 text-sm font-medium border-l border-slate-300 ${scheduleView === "day" ? "bg-blue-600 text-white" : "text-slate-700 hover:bg-slate-50"}`}

    </div>
  );
}

// Compute a rendering plan for the weekly grid of one employee.
// Returns plan[dayId][hour] = { type, role?, rowSpan, startHour } for cells
// that should render (as the start of a run), or null for cells that are
// covered by an earlier rowSpan-merged cell in the same column.
function buildEmployeeWeekPlan(schedule, username, shiftId) {
  const plan = {};
  DAYS.forEach(d => {
    plan[d.id] = {};
    let running = null;
    HOURS.forEach(h => {
      const inShift = isHourInShift(shiftId, h);
      if (!inShift) {
        if (running && running.type === "off" && running.endHour === h - 1) {
          running.rowSpan += 1;
          running.endHour = h;
          plan[d.id][h] = null;
        } else {
          running = { type: "off", role: "", rowSpan: 1, startHour: h, endHour: h };
          plan[d.id][h] = running;
        }
        return;
      }
      const assigns = getCellAssignments(schedule, d.id, h);
      const mine = assigns.find(a => a.username.toLowerCase() === username.toLowerCase());
      const role = mine ? mine.role : "";
      if (role && running && running.type === "assigned" && running.role === role && running.endHour === h - 1) {
        running.rowSpan += 1;
        running.endHour = h;
        plan[d.id][h] = null;
      } else {
        running = { type: "assigned", role, rowSpan: 1, startHour: h, endHour: h };
        plan[d.id][h] = running;
        if (!role) running = null; // empty in-shift hours don't merge
      }
    });
  });
  return plan;
}

function EmployeeGrid({ schedule, username, shiftId }) {
  const { rolesById } = useShared();
  const resolvedShift = shiftId || DEFAULT_SHIFT_ID;
  const plan = buildEmployeeWeekPlan(schedule, username, resolvedShift);
  return (
    <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
      <table className="w-full text-sm border-collapse">
        <thead>
          <tr>
